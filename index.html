function App() {
  const [usuarios, setUsuarios] = useState([]);
  const [carregandoUsuarios, setCarregandoUsuarios] = useState(true);
  const [erroUsuarios, setErroUsuarios] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [carregandoAuth, setCarregandoAuth] = useState(true);

  useEffect(() => {
    async function carregar() {
      const { data, error } = await supabaseClient.from("usuarios").select("*").order("created_at");
      if (error) {
        setErroUsuarios("Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.");
      } else {
        setUsuarios((data || []).map(rowToUsuario));
      }
      setCarregandoUsuarios(false);
    }
    carregar();
  }, []);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => {
      setAuthUser(data.session ? data.session.user : null);
      setCarregandoAuth(false);
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      setAuthUser(session ? session.user : null);
    });
    return () => { listener.subscription.unsubscribe(); };
  }, []);

  const usuarioLogado = authUser
    ? usuarios.find(u => u.email.toLowerCase() === (authUser.email || "").toLowerCase())
    : null;

  if (carregandoUsuarios || carregandoAuth) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0F141C", color: "#8893A6", fontFamily: "'Inter', sans-serif" }}>
        Carregando...
      </div>
    );
  }

  if (erroUsuarios) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0F141C", color: "#E07A7A", fontFamily: "'Inter', sans-serif", textAlign: "center", padding: 20 }}>
        {erroUsuarios}
      </div>
    );
  }

  if (!authUser) {
    return <TelaLogin />;
  }

  if (!usuarioLogado) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "#0F141C", color: "#E07A7A", fontFamily: "'Inter', sans-serif", textAlign: "center", padding: 20 }}>
        <div>Seu usuário está autenticado, mas não tem permissões cadastradas no sistema.<br />Fale com um administrador.</div>
        <button onClick={() => supabaseClient.auth.signOut()} style={{ marginTop: 16, background: "none", border: "1px solid #2A3445", color: "#AEB7C7", padding: "8px 14px", borderRadius: 8, cursor: "pointer" }}>Sair</button>
      </div>
    );
  }

  return (
    <SistemaEstoque
      usuarioLogado={usuarioLogado}
      usuarios={usuarios}
      setUsuarios={setUsuarios}
      onLogout={() => supabaseClient.auth.signOut()}
    />
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  componentDidCatch(erro, info) { console.error("Erro capturado pelo ErrorBoundary:", erro, info); }
  render() {
    if (this.state.erro) {
      return React.createElement("div", {
        style: { minHeight: "100vh", background: "#0F141C", color: "#F3EFE6", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "sans-serif", textAlign: "center" }
      },
        React.createElement("div", { style: { fontSize: 40, marginBottom: 12 } }, "⚠️"),
        React.createElement("h2", { style: { marginBottom: 10 } }, "Algo deu errado nessa tela"),
        React.createElement("div", {
          style: { background: "#161D29", border: "1px solid #3A1818", borderRadius: 8, padding: "12px 16px", maxWidth: 600, marginBottom: 20, color: "#E07A7A", fontFamily: "monospace", fontSize: 13, textAlign: "left", overflowWrap: "break-word" }
        }, String(this.state.erro && this.state.erro.message || this.state.erro)),
        React.createElement("div", { style: { fontSize: 13, color: "#8893A6", marginBottom: 20 } }, "Tire um print desta tela (com a mensagem em vermelho) e envie para o suporte — isso ajuda a corrigir rapidinho."),
        React.createElement("button", {
          onClick: () => window.location.reload(),
          style: { background: "#D2A256", color: "#1A1408", border: "none", borderRadius: 8, padding: "12px 24px", fontWeight: 700, cursor: "pointer" }
        }, "Recarregar o sistema")
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
