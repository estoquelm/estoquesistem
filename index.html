function daysSince(dateStr) {
  if (!dateStr) return 9999;
  const d = new Date(dateStr);
  const today = new Date("2026-06-30");
  return Math.floor((today - d) / (1000 * 60 * 60 * 24));
}

// Bip sonoro usado na tela de separação (leitor de código de barras)
function tocarSom(tipo) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const gain = ctx.createGain();
    gain.connect(ctx.destination);
    const osc = ctx.createOscillator();
    osc.connect(gain);
    if (tipo === "ok") {
      osc.frequency.value = 880; osc.type = "sine";
      gain.gain.setValueAtTime(0.22, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
    } else if (tipo === "completo") {
      osc.frequency.value = 660; osc.type = "sine";
      gain.gain.setValueAtTime(0.22, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.12);
      const osc2 = ctx.createOscillator();
      osc2.connect(gain); osc2.type = "sine"; osc2.frequency.value = 990;
      osc2.start(ctx.currentTime + 0.13); osc2.stop(ctx.currentTime + 0.32);
    } else {
      osc.frequency.value = 190; osc.type = "sawtooth";
      gain.gain.setValueAtTime(0.28, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.35);
    }
  } catch (e) { /* ambiente sem suporte a áudio — ignora silenciosamente */ }
}

// Campo de busca de produto com autocomplete: filtra por código de barras, SKU e nome do produto
// (usado nos modais de Entrada e Saída para facilitar achar o produto rapidamente).
function ProdutoBuscaSelect({ produtos, value, onChange, getExtra, placeholder, onCadastrarNovo }) {
  const produtoSelecionado = produtos.find(p => String(p.id) === String(value));
  const [texto, setTexto] = useState("");
  const [aberto, setAberto] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    function handleClickFora(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setAberto(false);
    }
    document.addEventListener("mousedown", handleClickFora);
    return () => document.removeEventListener("mousedown", handleClickFora);
  }, []);

  const termo = texto.trim().toLowerCase();
  const resultados = termo === "" ? produtos.slice(0, 50) : produtos.filter(p => {
    return (p.nome || "").toLowerCase().includes(termo)
      || (p.sku || "").toLowerCase().includes(termo)
      || (p.codigoBarras || "").toLowerCase().includes(termo)
      || (p.marca || "").toLowerCase().includes(termo);
  }).slice(0, 50);

  function selecionar(p) {
    onChange(String(p.id));
    setTexto("");
    setAberto(false);
  }

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <input
        value={aberto ? texto : (produtoSelecionado ? `${produtoSelecionado.nome} (${produtoSelecionado.sku})` : "")}
        onChange={e => { setTexto(e.target.value); if (!aberto) setAberto(true); if (value) onChange(""); }}
        onFocus={() => { setTexto(""); setAberto(true); }}
        placeholder={placeholder || "Buscar por nome, SKU ou código de barras..."}
        style={inputStyle}
        autoComplete="off"
      />
      {aberto && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 50,
          background: "#1B2433", border: "1px solid #2A3445", borderRadius: 8,
          maxHeight: 260, overflowY: "auto", boxShadow: "0 8px 24px rgba(0,0,0,0.4)"
        }}>
          {resultados.length === 0 && (
            <div style={{ padding: "10px 12px", fontSize: 13, color: "#8893A6" }}>Nenhum produto encontrado</div>
          )}
          {onCadastrarNovo && (
            <div onMouseDown={e => e.preventDefault()}
              onClick={() => { const t = texto.trim(); setAberto(false); setTexto(""); onCadastrarNovo(t); }}
              style={{ padding: "10px 12px", cursor: "pointer", fontSize: 13.5, fontWeight: 700, color: "#D2A256", borderTop: resultados.length ? "1px solid #202A3A" : "none" }}
              onMouseEnter={e => e.currentTarget.style.background = "#232F45"}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
              + Cadastrar novo produto{texto.trim() ? ` "${texto.trim()}"` : ""}
            </div>
          )}
          {resultados.map(p => (
            <div key={p.id} onClick={() => selecionar(p)}
              style={{
                padding: "9px 12px", cursor: "pointer", fontSize: 13.5, color: "#F3EFE6",
                borderBottom: "1px solid #202A3A", display: "flex", justifyContent: "space-between", gap: 10
              }}
              onMouseDown={e => e.preventDefault()}
              onMouseEnter={e => e.currentTarget.style.background = "#232F45"}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
            >
              <span>
                {p.nome}
                <span style={{ color: "#8893A6", fontFamily: "monospace", fontSize: 12, marginLeft: 6 }}>
                  SKU {p.sku}{p.codigoBarras ? ` · ${p.codigoBarras}` : ""}
                </span>
              </span>
              {getExtra && <span style={{ color: "#8893A6", fontSize: 12, flexShrink: 0 }}>{getExtra(p)}</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function BarcodeScannerModal({ onDetected, onClose }) {
  const elementIdRef = React.useRef("barcode-scanner-" + Math.random().toString(36).slice(2));
  const scannerRef = React.useRef(null);
  const rodandoRef = React.useRef(false); // controla se a câmera está de fato ativa, evita stop() duplicado
  const [erro, setErro] = useState(null);
  const [iniciando, setIniciando] = useState(true);

  function pararComSeguranca() {
    if (!rodandoRef.current || !scannerRef.current) return Promise.resolve();
    rodandoRef.current = false;
    try {
      return scannerRef.current.stop()
        .then(() => { try { scannerRef.current.clear(); } catch (e) {} })
        .catch((e) => { console.warn("Aviso ao parar câmera:", e); });
    } catch (e) {
      console.warn("Aviso ao parar câmera:", e);
      return Promise.resolve();
    }
  }

  useEffect(() => {
    let cancelado = false;
    if (!window.Html5Qrcode) {
      setErro("Não foi possível carregar o leitor de código de barras. Verifique sua conexão com a internet.");
      setIniciando(false);
      return;
    }
    // A câmera só pode ser acessada em contexto seguro (HTTPS ou localhost).
    // Em HTTP comum o navegador nem exibe o pedido de permissão.
    if (!window.isSecureContext) {
      setErro("A câmera só pode ser usada em conexão segura (HTTPS). Este endereço está sendo aberto em HTTP — acesse o sistema por um link https:// para poder bipar pela câmera.");
      setIniciando(false);
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setErro("Este navegador não permite acesso à câmera nesta página. Se estiver dentro de outro aplicativo (WebView), abra o link diretamente no Chrome ou Safari.");
      setIniciando(false);
      return;
    }
    const html5Qrcode = new window.Html5Qrcode(elementIdRef.current, {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.QR_CODE,
      ],
      verbose: false,
    });
    scannerRef.current = html5Qrcode;

    html5Qrcode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 260, height: 140 } },
      (decodedText) => {
        if (cancelado) return;
        cancelado = true;
        pararComSeguranca().finally(() => {
          onDetected(decodedText);
        });
      },
      () => { /* leitura contínua, ignora falhas de frame individuais */ }
    ).then(() => {
      rodandoRef.current = true;
      if (!cancelado) setIniciando(false);
    }).catch((e) => {
      console.error("Erro ao iniciar câmera:", e);
      const nome = (e && (e.name || e.message || "")) + "";
      let msg = "Não foi possível acessar a câmera. Verifique as permissões do navegador.";
      if (/NotAllowedError|Permission/i.test(nome)) {
        msg = "Permissão de câmera negada. No navegador do celular, toque no cadeado/ícone ao lado do endereço, ative a permissão de Câmera para este site e tente novamente.";
      } else if (/NotFoundError|DevicesNotFound/i.test(nome)) {
        msg = "Nenhuma câmera foi encontrada neste dispositivo.";
      } else if (/NotReadableError|TrackStartError/i.test(nome)) {
        msg = "A câmera está sendo usada por outro aplicativo. Feche outros apps que usem a câmera e tente novamente.";
      } else if (/OverconstrainedError/i.test(nome)) {
        msg = "Não foi possível ajustar a câmera traseira deste dispositivo. Tente novamente ou use outro navegador.";
      } else if (/SecurityError/i.test(nome)) {
        msg = "Acesso à câmera bloqueado por segurança. Verifique se o endereço começa com https:// e tente novamente.";
      }
      setErro(msg);
      setIniciando(false);
    });

    return () => {
      cancelado = true;
      pararComSeguranca();
    };
  }, []);

  return (
    <Modal title="Bipar código de barras" onClose={onClose} width={360} zIndex={1200}>
      <div style={{ textAlign: "center" }}>
        {erro ? (
          <div style={{ color: "#E07A7A", fontSize: 13.5, padding: "20px 0" }}>{erro}</div>
        ) : (
          <>
            {iniciando && <div style={{ color: "#8893A6", fontSize: 13, marginBottom: 10 }}>Iniciando câmera…</div>}
            <div id={elementIdRef.current} style={{ width: "100%", borderRadius: 10, overflow: "hidden", background: "#000" }} />
            <div style={{ color: "#8893A6", fontSize: 12.5, marginTop: 12 }}>Aponte a câmera para o código de barras do produto.</div>
          </>
        )}
        <div style={{ marginTop: 16 }}>
          <Btn onClick={onClose}>Cancelar</Btn>
        </div>
      </div>
    </Modal>
  );
}

function carregarStorage(chave, padrao) {
  try {
    const raw = localStorage.getItem(chave);
    if (!raw) return padrao;
    const parsed = JSON.parse(raw);
    return parsed;
  } catch (e) {
    return padrao;
  }
}

function salvarStorage(chave, valor) {
  try {
    localStorage.setItem(chave, JSON.stringify(valor));
  } catch (e) {
    console.error("Erro ao salvar no armazenamento local:", e);
  }
}

function rowToProduto(r) {
  return {
    id: r.id, sku: r.sku, nome: r.produto, fornecedorId: r.fornecedor_id, empresaId: r.empresa_id,
    categoria: r.categoria, marca: r.marca, unidade: r.unidade,
    fileira: r.fileira, porta: r.porta, nivel: r.nivel, localizacao: r.localizacao,
    qtd: Number(r.qtd) || 0, min: Number(r.qtd_min) || 0, max: Number(r.qtd_max) || 0,
    status: r.status, ultimaSaida: r.ultima_saida, codigoBarras: r.codigo_barras,
  };
}
function produtoToRow(p) {
  // Localização primária (compatível com o formato antigo, colunas fileira/porta/nivel intactas)
  const localizacaoPrimaria = [p.fileira, p.porta, p.nivel].filter(Boolean).join("-");
  // Localizações adicionais (novo recurso) são anexadas ao mesmo campo de texto "localizacao",
  // separadas por " | ", sem exigir nenhuma coluna nova no banco.
  const localizacoesExtras = (p.localizacaoExtra || []).filter(Boolean);
  const localizacaoCompleta = [localizacaoPrimaria, ...localizacoesExtras].filter(Boolean).join(" | ");
  return {
    sku: p.sku, produto: p.nome, fornecedor_id: p.fornecedorId || null, empresa_id: p.empresaId || null,
    categoria: p.categoria, marca: p.marca, unidade: p.unidade,
    fileira: p.fileira || null, porta: p.porta, nivel: p.nivel || null,
    localizacao: localizacaoCompleta,
    qtd: Number(p.qtd) || 0, qtd_min: Number(p.min) || 0, qtd_max: Number(p.max) || 0,
    status: p.status || "Ativo", ultima_saida: p.ultimaSaida || null,
    codigo_barras: p.codigoBarras || null,
  };
}

  const [entradaModo, setEntradaModo] = useState("existente"); // 'existente' | 'novo'

  // ---- Localizações adicionais do produto (múltiplas localizações no mesmo produto) ----
  const [produtoLocExtras, setProdutoLocExtras] = useState([]); // array de strings tipo "2-B-3"
  const [locExtraFileira, setLocExtraFileira] = useState("");
  const [locExtraPorta, setLocExtraPorta] = useState("");
  const [locExtraNivel, setLocExtraNivel] = useState("");

  function adicionarLocalizacaoExtra() {
    const codigo = [locExtraFileira, locExtraPorta, locExtraNivel].filter(Boolean).join("-");
    if (!codigo) return;
    setProdutoLocExtras(prev => prev.includes(codigo) ? prev : [...prev, codigo]);
    setLocExtraFileira(""); setLocExtraPorta(""); setLocExtraNivel("");
  }
  function removerLocalizacaoExtra(codigo) {
    setProdutoLocExtras(prev => prev.filter(c => c !== codigo));
  }

  // ---- Busca de produto na tela de Entrada (por SKU, nome ou código de barras) ----
  const [entradaBusca, setEntradaBusca] = useState("");
  const [entradaDropdownAberto, setEntradaDropdownAberto] = useState(false);
  const entradaResultados = useMemo(() => {
    const t = entradaBusca.trim().toLowerCase();
    if (!t) return [];
    return produtos.filter(p =>
      (p.nome || "").toLowerCase().includes(t) ||
      (p.sku || "").toLowerCase().includes(t) ||
      (p.codigoBarras || "").toLowerCase().includes(t)
    ).slice(0, 8);
  }, [produtos, entradaBusca]);

  function buscarProdutoPorCodigo(codigo) {
    const alvo = String(codigo).trim().toLowerCase();
    return produtos.find(p =>
      (p.codigoBarras && String(p.codigoBarras).trim().toLowerCase() === alvo) ||
      (p.sku && String(p.sku).trim().toLowerCase() === alvo)
    );
  }

  function handleBarcodeDetected(codigo) {
    if (scannerAlvo === "produto") {
      setProdutoCodBarras(codigo);
    } else if (scannerAlvo === "entrada") {
      const produto = buscarProdutoPorCodigo(codigo);
      if (produto) { setEntradaProdutoId(String(produto.id)); }
      else { alert(`Nenhum produto encontrado com o código "${codigo}". Cadastre o produto com esse código de barras primeiro.`); }
    } else if (scannerAlvo === "saida") {
      const produto = buscarProdutoPorCodigo(codigo);
      if (produto) { setSaidaProdutoId(String(produto.id)); }
      else { alert(`Nenhum produto encontrado com o código "${codigo}". Cadastre o produto com esse código de barras primeiro.`); }
    } else if (scannerAlvo === "busca") {
      setBuscaEstoque(codigo);
    } else if (scannerAlvo === "separacao") {
      processarScanSeparacao(codigo, scanQtdSepar);
    } else if (scannerAlvo === "portapalete") {
      if (codigoPortaPaleteRef.current) codigoPortaPaleteRef.current.value = codigo;
    } else if (scannerAlvo === "quickadd_portapalete") {
      if (codigoQuickAddPPRef.current) codigoQuickAddPPRef.current.value = codigo;
    } else if (scannerAlvo === "separacaoPP") {
      handleScanPP(codigo);
    }
    setScannerAlvo(null);
  }

  const fornecedorNome = (id) => fornecedores.find(f => f.id === id)?.nomeFantasia || "—";
  const empresaNome = (id) => empresas.find(e => e.id === id)?.nomeFantasia || "—";
  const portaPaleteById = (id) => portaPaletes.find(pp => pp.id === Number(id));
  const portaPaleteByCodigo = (codigo) => portaPaletes.find(pp => (pp.codigo || "").toUpperCase() === String(codigo).trim().toUpperCase());
  const portaPaleteLabel = (pp) => pp ? [pp.fileira, pp.porta, pp.nivel].filter(Boolean).join("-") : "—";
  const portaPaleteDoProduto = (p) => portaPaletes.find(pp => pp.fileira === p.fileira && pp.porta === p.porta && pp.nivel === p.nivel);
  // Quanto do produto está em cada porta-palete. O total do produto (estoque.qtd) manda:
  // - sobra (ex.: entrada por NF/PDF) vai para a porta-palete "principal" do produto;
  // - falta (ex.: baixa feita em outro lugar) é descontada, começando pela principal.
  const distribuicaoDoProduto = (p) => {
    let lista = estoquePP.filter(r => r.produtoId === p.id && r.qtd > 0).map(r => ({ ppId: r.ppId, qtd: r.qtd }));
    const soma = lista.reduce((t, r) => t + r.qtd, 0);
    const primarioId = portaPaleteDoProduto(p)?.id ?? null;
    if (soma < p.qtd) {
      const falta = p.qtd - soma;
      const ex = lista.find(r => r.ppId === primarioId);
      if (ex) ex.qtd += falta; else lista.push({ ppId: primarioId, qtd: falta });
    } else if (soma > p.qtd) {
      let excesso = soma - p.qtd;
      const ordem = [...lista].sort((a, b) => (b.ppId === primarioId) - (a.ppId === primarioId));
      for (const r of ordem) { const t = Math.min(r.qtd, excesso); r.qtd -= t; excesso -= t; if (excesso <= 0) break; }
      lista = lista.filter(r => r.qtd > 0);
    }
    return lista;
  };
  const qtdNaPP = (p, ppId) => (distribuicaoDoProduto(p).find(r => r.ppId === ppId)?.qtd) || 0;
  const produtosDaPortaPalete = (pp) => !pp ? [] : produtos
    .map(p => ({ ...p, qtdPP: qtdNaPP(p, pp.id) }))
    .filter(p => p.qtdPP > 0 || (p.qtd === 0 && p.fileira === pp.fileira && p.porta === pp.porta && p.nivel === pp.nivel));
  // Desconta "qtd" da lista de distribuição. ppId undefined = automático (principal primeiro).
  const descontarDist = (dist, qtd, ppId) => {
    const nova = dist.map(r => ({ ...r }));
    let resta = qtd;
    const alvo = ppId === undefined ? nova : nova.filter(r => r.ppId === ppId);
    for (const r of alvo) { const t = Math.min(r.qtd, resta); r.qtd -= t; resta -= t; if (resta <= 0) break; }
    return nova.filter(r => r.qtd > 0);
  };
  // Retorna TODAS as localizações em texto de um produto (primária + extras), já que hoje
  // o sistema só guarda uma quantidade total por produto — não há quantidade por local.
  const localizacoesDoProduto = (p) => {
    const bruto = p.localizacao || [p.fileira, p.porta, p.nivel].filter(Boolean).join("-");
    return String(bruto).split("|").map(s => s.trim()).filter(Boolean);
  };

  const stats = useMemo(() => {
    const pendentes = notas.filter(n => n.status === "Pendente").length;
    const recebidas = notas.filter(n => n.status !== "Pendente" && n.status !== "Cancelada").length;
    const valorTotal = notas.reduce((s, n) => s + n.valor, 0);
    const totalEstoque = produtos.reduce((s, p) => s + p.qtd, 0);
    const semEstoque = produtos.filter(p => p.qtd === 0).length;
    const abaixoMin = produtos.filter(p => p.qtd > 0 && p.qtd < p.min).length;
    const parados = produtos.filter(p => daysSince(p.ultimaSaida) >= 30).length;
    return { pendentes, recebidas, valorTotal, totalEstoque, semEstoque, abaixoMin, parados };
  }, [notas, produtos]);

  // ==== Estoque: localizações, filtros e relatório para download ====
  const locaisDoProduto = (p) => (p.localizacao || [p.fileira, p.porta, p.nivel].filter(Boolean).join("-"))
    .split("|").map(x => x.trim()).filter(Boolean);

  const listaLocaisEstoque = useMemo(() => {
    const set = new Set();
    produtos.forEach(p => locaisDoProduto(p).forEach(l => set.add(l)));
    return Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));
  }, [produtos]);

  const produtosFiltrados = useMemo(() => {
    const termos = buscaEstoque.toLowerCase().split(/\s+/).filter(Boolean);
    return produtos.filter(p => {
      if (filtroFornecedorEst && String(p.fornecedorId) !== String(filtroFornecedorEst)) return false;
      if (filtroLocalEst && !locaisDoProduto(p).includes(filtroLocalEst)) return false;
      if (apenasComEstoque && !(p.qtd > 0)) return false;
      if (termos.length === 0) return true;
      const texto = [p.nome, p.sku, p.codigoBarras, p.marca, fornecedorNome(p.fornecedorId), locaisDoProduto(p).join(" ")]
        .join(" ").toLowerCase();
      return termos.every(t => texto.includes(t));
    });
  }, [produtos, buscaEstoque, filtroFornecedorEst, filtroLocalEst, apenasComEstoque, fornecedores]);

  const linhasRelatorioEstoque = () => produtosFiltrados.map(p => ({
    sku: p.sku || "", barras: p.codigoBarras || "", codForn: p.marca || "",
    nome: p.nome || "", fornecedor: fornecedorNome(p.fornecedorId) === "—" ? "" : fornecedorNome(p.fornecedorId),
    local: locaisDoProduto(p).join(" | "), qtd: p.qtd,
  }));

  const nomeFornecedorFiltro = () => fornecedores.find(f => String(f.id) === String(filtroFornecedorEst))?.nomeFantasia || "";

  const nomeBaseRelatorio = () => {
    const partes = ["estoque"];
    if (filtroFornecedorEst) partes.push(nomeFornecedorFiltro());
    if (filtroLocalEst) partes.push(filtroLocalEst);
    partes.push(new Date().toISOString().slice(0, 10));
    return partes.join("_").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9_-]+/g, "-");
  };

  const baixarRelatorioEstoqueCSV = () => {
    const linhas = linhasRelatorioEstoque();
    if (linhas.length === 0) { alert("Nenhum produto na lista para exportar."); return; }
    const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const cab = ["SKU", "Código de barras", "Cód. fornecedor", "Produto", "Fornecedor", "Localização", "Quantidade"];
    const corpo = linhas.map(l => [l.sku, l.barras, l.codForn, l.nome, l.fornecedor, l.local, l.qtd].map(esc).join(";"));
    const csv = "\uFEFF" + [cab.map(esc).join(";"), ...corpo].join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nomeBaseRelatorio() + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const imprimirRelatorioEstoque = () => {
    const linhas = linhasRelatorioEstoque();
    if (linhas.length === 0) { alert("Nenhum produto na lista para exportar."); return; }
    const h = v => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const filtros = [

    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${h(nomeBaseRelatorio())}</title>
<style>body{font-family:Arial,sans-serif;font-size:12px;color:#111;margin:20px}h1{font-size:18px;margin:0 0 4px}

${linhas.map(l => `<tr><td>${h(l.sku)}</td><td>${h(l.barras)}</td><td>${h(l.codForn)}</td><td>${h(l.nome)}</td><td>${h(l.fornecedor)}</td><td>${h(l.local)}</td><td class="q">${h(l.qtd)}</td></tr>`).join("")}
</tbody><tfoot><tr><td colspan="6">TOTAL</td><td class="q">${totalUn}</td></tr></tfoot></table>
<script>window.onload=function(){window.print()}<\/script></body></html>`);
    w.document.close();

  const produtosParados = useMemo(() => {

      .filter(p => daysSince(p.ultimaSaida) >= filtroParados)

  // ==== NOTAS FISCAIS: organização por mês (novo — não muda como as notas são salvas) ====
  const mesesDisponiveisNotas = useMemo(() => {
    const chaves = new Set();
    notas.forEach(n => {
      const emissaoStr = n && n.emissao ? String(n.emissao) : "";
      if (emissaoStr.length >= 7) chaves.add(emissaoStr.slice(0, 7));
    });
    return Array.from(chaves).sort().reverse().map(chave => {
      try {
        const [ano, mes] = chave.split("-");
        const label = new Date(Number(ano), Number(mes) - 1, 1)
          .toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
        return { chave, label: label.charAt(0).toUpperCase() + label.slice(1) };
      } catch (e) {
        return { chave, label: chave };
      }
    });
  }, [notas]);

  const notasFiltradas = useMemo(() => {
    const b = buscaNotas.trim().toLowerCase();
    return notas
      .filter(n => filtroMesNota === "todos" || String(n.emissao || "").slice(0, 7) === filtroMesNota)
      .filter(n => {
        if (!b) return true;
        return (
          String(n.numero || "").toLowerCase().includes(b) ||
          empresaNome(n.empresaId).toLowerCase().includes(b) ||
          fornecedorNome(n.fornecedorId).toLowerCase().includes(b) ||
          (n.colaborador || "").toLowerCase().includes(b) ||
          (n.status || "").toLowerCase().includes(b)
        );

      .sort((a, b2) => new Date(b2.emissao || 0) - new Date(a.emissao || 0));
  }, [notas, buscaNotas, filtroMesNota]);

  // Agrupa as notas filtradas por mês (só é usado visualmente quando "Todos os meses" está selecionado)
  const notasAgrupadasPorMes = useMemo(() => {

  }

  // Grava quanto do produto está em cada porta-palete (tabela estoque_pp).
  async function gravarDistribuicao(produtoId, lista) {
    const validos = lista.filter(r => r.ppId && r.qtd > 0);
    const manter = new Set(validos.map(r => r.ppId));
    const apagar = estoquePP.filter(r => r.produtoId === produtoId && !manter.has(r.ppId)).map(r => r.id);
    if (validos.length) {
      const { error } = await supabaseClient.from("estoque_pp").upsert(
        validos.map(r => ({ produto_id: produtoId, porta_palete_id: r.ppId, qtd: r.qtd })),
        { onConflict: "produto_id,porta_palete_id" });
      if (error) throw error;
    }
    if (apagar.length) {
      const { error } = await supabaseClient.from("estoque_pp").delete().in("id", apagar);
      if (error) throw error;
    }
  }

  // Salva a distribuição por porta-palete + campos do produto (qtd total, última saída...) e
  // garante que a localização em texto do produto inclua todas as porta-paletes onde ele tem estoque.
  async function persistirEstoque(produto, dist, extra = {}) {
    await gravarDistribuicao(produto.id, dist);
    const primaria = [produto.fileira, produto.porta, produto.nivel].filter(Boolean).join("-");
    const tokens = String(produto.localizacao || primaria).split("|").map(x => x.trim()).filter(Boolean);
    dist.filter(r => r.ppId && r.qtd > 0).forEach(r => {
      const l = portaPaleteLabel(portaPaleteById(r.ppId));
      if (l && l !== "—" && !tokens.includes(l)) tokens.push(l);
    });
    const update = { ...extra };
    const txt = tokens.join(" | ");
    if (!("localizacao" in update) && txt !== (produto.localizacao || "")) update.localizacao = txt;
    if (Object.keys(update).length) {
      const { error } = await supabaseClient.from("estoque").update(update).eq("id", produto.id);
      if (error) throw error;
    }
  }

  // Move QUANTIDADE de um produto de uma porta-palete (ou "sem porta-palete") para outra.
  // O estoque total do produto não muda.
  async function transferirParaPP(produtoId, origemPpId, destinoPpId, qtd) {
    const produto = produtos.find(p => p.id === Number(produtoId));
    const dest = portaPaleteById(destinoPpId);
    if (!produto || !dest) return;
    qtd = Number(qtd);
    if (!qtd || qtd < 1) { alert("Informe quantas unidades vão ser movidas pra cá."); return; }
    const dist = distribuicaoDoProduto(produto).map(r => ({ ...r }));
    const origem = dist.find(r => r.ppId === origemPpId);
    if (!origem || qtd > origem.qtd) { alert(`Só há ${origem ? origem.qtd : 0} un. no local de origem.`); return; }
    origem.qtd -= qtd;
    const d = dist.find(r => r.ppId === dest.id);
    if (d) d.qtd += qtd; else dist.push({ ppId: dest.id, qtd });
    try {
      await persistirEstoque(produto, dist.filter(r => r.qtd > 0));
      await recarregarTudo();
    } catch (e) {
      alert("Erro ao mover quantidade: " + e.message + "\n\nConfira se a tabela estoque_pp foi criada no Supabase (rode o arquivo estoque_pp.sql).");
    }
  }

  // Corrige a quantidade de um produto dentro de UMA porta-palete. O estoque total é ajustado na diferença.
  async function ajustarQtdNaPP(produto, pp) {
    const atual = qtdNaPP(produto, pp.id);
    const txt = window.prompt(`Quantidade de "${produto.nome}" em ${portaPaleteLabel(pp)} (hoje: ${atual}).\nO estoque total será ajustado na diferença.`, String(atual));
    if (txt === null) return;
    const nova = parseInt(txt);
    if (isNaN(nova) || nova < 0) { alert("Quantidade inválida."); return; }
    if (nova === atual) return;
    const dist = distribuicaoDoProduto(produto).map(r => ({ ...r }));
    const r = dist.find(x => x.ppId === pp.id);
    if (r) r.qtd = nova; else dist.push({ ppId: pp.id, qtd: nova });
    const total = dist.reduce((t, x) => t + x.qtd, 0);
    try {
      await persistirEstoque(produto, dist.filter(x => x.qtd > 0), { qtd: total });
      await recarregarTudo();
    } catch (e) {
      alert("Erro ao ajustar quantidade: " + e.message + "\n\nConfira se a tabela estoque_pp foi criada no Supabase (rode o arquivo estoque_pp.sql).");
    }
  }

  // Registra a entrada. Se for produto novo, cadastra o produto (já com fornecedor e localização)
  // e lança a entrada na mesma ação. Se um dos passos falhar, desfaz o anterior.
  async function registrarEntradaCompleta(d) {
    if (salvandoEntrada) return;
    setEntradaErro("");
    const qtd = Number(d.quantidade);
    if (!qtd || qtd < 1) { setEntradaErro("Informe uma quantidade maior que zero."); return; }
    setSalvandoEntrada(true);
    try {
      let produtoId, produtoCriado = false, desfazer = null;

      if (entradaModo === "novo") {
        const sku = (d.sku || "").trim();
        const nome = (d.nome || "").trim();
        const barras = (produtoCodBarras || "").trim();
        if (!sku || !nome) { setEntradaErro("Informe o SKU e o nome do produto novo."); return; }
        if (!entradaFornecedorSel) { setEntradaErro("Selecione o fornecedor (ou crie um novo no botão +)."); return; }
        if (!entradaEmpresaSel) { setEntradaErro("Selecione a empresa (ou crie uma nova no botão +)."); return; }
        if (!entradaFileira || !String(entradaPorta).trim() || !entradaNivel) { setEntradaErro("Informe a localização: fileira, porta-palete e nível."); return; }
        if (produtos.some(p => String(p.sku || "").trim().toLowerCase() === sku.toLowerCase())) {
          setEntradaErro(`Já existe um produto com o SKU "${sku}". Use a aba "Produto já cadastrado".`); return;
        }
        if (barras && produtos.some(p => p.codigoBarras && String(p.codigoBarras).trim() === barras)) {
          setEntradaErro(`Já existe um produto com o código de barras "${barras}".`); return;
        }
        const row = produtoToRow({
          sku, nome, fornecedorId: entradaFornecedorSel, empresaId: entradaEmpresaSel,
          categoria: d.categoria, marca: d.marca, unidade: d.unidade || "UN",
          fileira: Number(entradaFileira), porta: String(entradaPorta).trim(), nivel: Number(entradaNivel),
          qtd, min: Number(d.min) || 0, max: Number(d.max) || 0, codigoBarras: barras || null,
        });
        const { data, error } = await supabaseClient.from("estoque").insert(row).select().single();
        if (error) { setEntradaErro("Erro ao cadastrar o produto: " + error.message); return; }
        produtoId = data.id; produtoCriado = true;
      } else {
        const produto = produtos.find(p => String(p.id) === String(entradaProdutoId));
        if (!produto) { setEntradaErro("Selecione um produto (ou cadastre um novo)."); return; }
        const pp = portaPaleteById(entradaPPSel);
        const distAntes = distribuicaoDoProduto(produto).map(r => ({ ...r }));
        const distNova = distAntes.map(r => ({ ...r }));
        if (pp) {
          const r = distNova.find(x => x.ppId === pp.id);
          if (r) r.qtd += qtd; else distNova.push({ ppId: pp.id, qtd });
          if (!(d.obs || "").trim()) d.obs = portaPaleteLabel(pp);
        }
        try {
          await persistirEstoque(produto, distNova, { qtd: produto.qtd + qtd });
        } catch (errProd) { setEntradaErro("Erro ao atualizar o estoque: " + errProd.message); return; }
        produtoId = produto.id;
        desfazer = { produto, distAntes };
      }

      const { error: errMov } = await supabaseClient.from("entradas").insert({
        produto_id: produtoId, quantidade: qtd,
        numero_nf: d.numeroNf, observacoes: d.obs, usuario: usuarioLogado.email,
      });
      if (errMov) {
        // desfaz o passo anterior para não deixar estoque sem movimentação
        if (produtoCriado) await supabaseClient.from("estoque").delete().eq("id", produtoId);
        else if (desfazer) {
          try { await persistirEstoque(desfazer.produto, desfazer.distAntes, { qtd: desfazer.produto.qtd, localizacao: desfazer.produto.localizacao || "" }); } catch (_) {}
        }
        setEntradaErro("Erro ao registrar a entrada: " + errMov.message); return;
      }
      await recarregarTudo();
      setModalEntrada(false);
    } finally {
      setSalvandoEntrada(false);
    }
  }

    if (errProd) { alert("Erro ao atualizar estoque: " + errProd.message); return; }

  async function registrarSaida(dados) {
    const produto = produtos.find(p => p.id === dados.produtoId);
    if (!produto) { alert("Selecione um produto válido."); return; }
    const qtdSaida = Number(dados.quantidade);
    const ppId = dados.ppId ? Number(dados.ppId) : undefined;
    if (ppId !== undefined) {
      const disp = qtdNaPP(produto, ppId);
      if (qtdSaida > disp) { alert(`Só há ${disp} un. de ${produto.nome} nessa porta-palete.`); return; }
    }
    const novaQtd = Math.max(0, produto.qtd - qtdSaida);
    const hoje = new Date().toISOString().slice(0, 10);
    try {
      await persistirEstoque(produto, descontarDist(distribuicaoDoProduto(produto), qtdSaida, ppId), { qtd: novaQtd, ultima_saida: hoje });
    } catch (errProd) { alert("Erro ao atualizar estoque: " + errProd.message); return; }
    const labelPP = ppId !== undefined ? portaPaleteLabel(portaPaleteById(ppId)) : "";
    const { error: errMov } = await supabaseClient.from("saidas").insert({
      produto_id: dados.produtoId, quantidade: qtdSaida,
      destino: dados.destino, motivo: [dados.motivo, labelPP ? `(${labelPP})` : ""].filter(Boolean).join(" "), usuario: usuarioLogado.email,
    });
    if (errMov) { alert("Erro ao registrar saída: " + errMov.message); return; }
    setSaidaPPSel("");
    await recarregarTudo();
    setModalSaida(false);
  }

  // ==== SEPARAÇÃO POR PORTA-PALETE: lógica de bipagem e baixa automática ====
  function handleScanPP(raw) {
    try {
    if (!raw || !raw.trim()) return;
    const val = raw.trim();
    setScanInputPP("");

    // 1) Tenta interpretar como código de barras de uma porta-palete
    const pp = portaPaleteByCodigo(val);
    if (pp) {
      const prodsNaPP = produtosDaPortaPalete(pp);
      setScanPortaPaletePP({ id: pp.id, codigo: pp.codigo, local: portaPaleteLabel(pp), produtos: prodsNaPP });
      setSepMsgPP(prodsNaPP.length > 0
        ? { tipo: "info", texto: `Porta-palete ${pp.codigo} (${portaPaleteLabel(pp)}) — ${prodsNaPP.length} produto(s) encontrado(s)` }
        : { tipo: "erro", texto: `Porta-palete ${pp.codigo} não tem produtos cadastrados.` });
      return;
    }

    // 2) Tenta interpretar como código de barras ou SKU de um produto
    const prod = produtos.find(p =>
      (p.codigoBarras && String(p.codigoBarras).toUpperCase() === val.toUpperCase()) ||
      (p.sku && p.sku.toUpperCase() === val.toUpperCase())
    );
    if (prod) {
      const ppAtivo = scanPortaPaletePP ? portaPaleteById(scanPortaPaletePP.id) : null;
      if (ppAtivo && qtdNaPP(prod, ppAtivo.id) <= 0) {
        const onde = distribuicaoDoProduto(prod).map(r => `${r.ppId ? portaPaleteLabel(portaPaleteById(r.ppId)) : "sem porta-palete"} (${r.qtd} un)`).join(", ");
        setSepMsgPP({ tipo: "erro", texto: `${prod.nome} não tem estoque em ${portaPaleteLabel(ppAtivo)}${onde ? ` — está em: ${onde}` : ""}. Bipe o porta-palete correto.` });
        return;
      }
      const origemTxt = ppAtivo ? ` de ${portaPaleteLabel(ppAtivo)}` : "";
      if (sepQtdModoPP === "bip") {
        adicionarSepPP(prod, 1);
        setSepMsgPP({ tipo: "ok", texto: `+1 unidade de ${prod.nome} (${prod.sku})${origemTxt}` });
      } else {
        const qtdStr = window.prompt(`Quantidade de "${prod.nome}" a separar${origemTxt}:`);
        const qtd = parseInt(qtdStr);
        if (qtd > 0) {
          adicionarSepPP(prod, qtd);
          setSepMsgPP({ tipo: "ok", texto: `${qtd}x ${prod.nome} adicionado(s) à separação${origemTxt}` });
        }
      }
      return;
    }

    setSepMsgPP({ tipo: "erro", texto: `Código "${val}" não reconhecido como porta-palete nem como produto.` });
    } catch (e) {
      console.error("Erro ao processar scan:", e);
      setSepMsgPP({ tipo: "erro", texto: "Erro ao processar o código lido. Tente novamente." });
    }
  }

  // Adiciona item à lista de separação. Se há um porta-palete bipado, a baixa sai DELE (e só dele).
  function adicionarSepPP(prod, qtdAdd) {
    const ppAtivo = scanPortaPaletePP ? portaPaleteById(scanPortaPaletePP.id) : null;
    const ppId = ppAtivo ? ppAtivo.id : null;
    const locais = distribuicaoDoProduto(prod).map(r => `${r.ppId ? portaPaleteLabel(portaPaleteById(r.ppId)) : "sem porta-palete"}: ${r.qtd} un`);
    const estoqueAtual = ppId ? qtdNaPP(prod, ppId) : prod.qtd;
    setItensSeparPP(prev => {
      const ex = prev.find(i => i.produtoId === prod.id && (i.ppId || null) === ppId);
      if (ex) return prev.map(i => i === ex ? { ...i, qtd: i.qtd + qtdAdd } : i);
      return [...prev, { produtoId: prod.id, ppId, ppLabel: ppAtivo ? portaPaleteLabel(ppAtivo) : "", nome: prod.nome, sku: prod.sku, qtd: qtdAdd, estoqueAtual, locais }];
    });
  }

  function adicionarItemSepPP(p) {
    if (sepQtdModoPP === "bip") {
      adicionarSepPP(p, 1);
      setSepMsgPP({ tipo: "ok", texto: `+1 de ${p.nome}` });
    } else {
      const qtdStr = window.prompt(`Quantidade de "${p.nome}":`);
      const qtd = parseInt(qtdStr);
      if (qtd > 0) {
        adicionarSepPP(p, qtd);
        setSepMsgPP({ tipo: "ok", texto: `${qtd}x ${p.nome} adicionado` });
      }
    }
  }

  // Finaliza a separação: dá baixa automática no estoque (tabela "estoque") e registra
  // cada item como uma saída (tabela "saidas"), exatamente como a saída manual já faz.
  async function finalizarSepPP() {
    if (itensSeparPP.length === 0) return;
    const erros = itensSeparPP.filter(i => i.qtd > i.estoqueAtual);
    if (erros.length > 0) {
      setSepMsgPP({ tipo: "erro", texto: `Estoque insuficiente: ${erros.map(e => e.nome).join(", ")}` });
      return;
    }
    setFinalizandoSeparPP(true);
    try {
      const hoje = new Date().toISOString().slice(0, 10);
      // Agrupa por produto (o mesmo produto pode sair de mais de um porta-palete na mesma separação)
      const porProduto = new Map();
      for (const item of itensSeparPP) {
        const produto = produtos.find(p => p.id === item.produtoId);
        if (!produto) continue;
        const reg = porProduto.get(produto.id) || { produto, dist: distribuicaoDoProduto(produto), total: 0 };
        reg.dist = descontarDist(reg.dist, item.qtd, item.ppId || undefined);
        reg.total += item.qtd;
        porProduto.set(produto.id, reg);
      }
      for (const { produto, dist, total } of porProduto.values()) {
        await persistirEstoque(produto, dist, { qtd: Math.max(0, produto.qtd - total), ultima_saida: hoje });
      }
      for (const item of itensSeparPP) {
        if (!porProduto.has(item.produtoId)) continue;
        const { error: errMov } = await supabaseClient.from("saidas").insert({
          produto_id: item.produtoId, quantidade: item.qtd,
          destino: "Separação por porta-palete", motivo: `Separação de pedido${item.ppLabel ? ` · ${item.ppLabel}` : ""}`,
          usuario: usuarioLogado.email,
        });
        if (errMov) throw errMov;
      }
      await recarregarTudo();
      setSepMsgPP({ tipo: "ok", texto: `✓ Separação finalizada! Baixa dada em ${itensSeparPP.length} produto(s).` });
      setItensSeparPP([]);
      setScanPortaPaletePP(null);
    } catch (e) {
      setSepMsgPP({ tipo: "erro", texto: "Erro ao finalizar separação: " + e.message });
    } finally {
      setFinalizandoSeparPP(false);
    }
  }

  function parseNumeroBR(str) {
    if (!str) return 0;
    let s = String(str).trim();
    s = s.replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function parseItensDanfe(textoOriginal) {
    // Remove ruído típico de OCR (bordas de tabela reconhecidas como | [ ] { })
    // mas preserva quebras de linha, que ajudam a separar um item do outro
    // e a recuperar códigos que quebram em duas linhas na coluna COD.PROD.
    const linhas = textoOriginal
      .replace(/[|\[\]{}]/g, " ")
      .split(/[\r\n]+/)
      .map((l) => l.replace(/\s+/g, " ").trim())
      .filter(Boolean);

    const itens = [];
    // COD.PROD  DESCRIÇÃO ... NCM/SH(7-8 díg.) ... UN  QUANT.  [V.UNITARIO] ...
    // Entre NCM e UN aceitamos qualquer ruído (CST/CFOP às vezes saem
    // corrompidos do OCR), por isso usamos .*? em vez de exigir os
    // dígitos exatos de CST e CFOP.
    const rowRegex = /^(\d{8,14})\s+(.+?)\s+(\d{7,8})\s+.*?\b([A-Z]{2,4})\b\s+([\d.,]{1,12})(?:\s+([\d.,]{1,12}))?/;

    for (let i = 0; i < linhas.length; i++) {
      const m = linhas[i].match(rowRegex);
      if (!m) continue;
      const quantidade = parseNumeroBR(m[5]);
      if (quantidade <= 0) continue;

      let codigo = m[1];
      // Se a linha seguinte for só um fragmento curto de dígitos (sufixo do
      // código que quebrou de linha na coluna COD.PROD), anexa ao código.
      const proxima = linhas[i + 1];
      if (proxima && proxima.length <= 8 && !/^\d{8,14}\s/.test(proxima)) {
        const sufixo = proxima.match(/^(\d{1,4})(?:\D|$)/);
        if (sufixo) codigo += sufixo[1];
      }

      itens.push({
        id: Math.random().toString(36).slice(2),
        codigo,
        descricao: m[2].replace(/[-–]\s*$/, "").trim(),
        unidade: m[4],
        quantidade,
        valorUnitario: m[6] ? parseNumeroBR(m[6]) : 0,
        incluir: true,
      });
    }
    return itens;
  }

  // Parser alternativo, mais tolerante, usado quando o layout padrão de DANFE
  // não é reconhecido (comum em PDFs gerados por apps de scanner como o
  // CamScanner, onde o OCR sai com colunas desalinhadas, sem NCM legível etc.)
  function parseItensFallback(textoOriginal) {
    const linhas = textoOriginal
      .replace(/[|\[\]{}]/g, " ")
      .split(/[\r\n]+/)
      .map((l) => l.replace(/\s+/g, " ").trim())
      .filter(Boolean);

    const itens = [];
    // CÓDIGO (alfanumérico) ... DESCRIÇÃO (texto) ... [UN] QTD no fim da linha
    const looseRegex = /^([A-Z0-9][A-Z0-9.\-\/]{2,15})\s+(.{3,70}?)\s+(?:UN|UND|UNI|UNID|PC|PCT|CX|KG|MT|LT)?\.?\s*[:\-]?\s*(\d{1,4}(?:[.,]\d{1,3})?)\s*(?:UN|UND|UNI|UNID|PC|PCT|CX)?\s*$/i;

    for (const l of linhas) {
      // ignora linhas claramente de cabeçalho/rodapé/totais
      if (/total|subtotal|cnpj|endere|telefone|emiss|chave de acesso|valor a pagar/i.test(l)) continue;
      const m = l.match(looseRegex);
      if (!m) continue;
      const quantidade = parseNumeroBR(m[3]);
      if (quantidade <= 0 || quantidade > 99999) continue;
      const descricao = m[2].replace(/[-–]\s*$/, "").trim();
      if (descricao.length < 3) continue;
      itens.push({
        id: Math.random().toString(36).slice(2),
        codigo: m[1],
        descricao,
        unidade: "UN",
        quantidade,
        valorUnitario: 0,
        incluir: true,
      });
    }
    return itens;
  }

  function extrairNumeroNota(texto) {
    const m = texto.match(/N\.?\s*0*?(\d{4,9})\s*(?:S[ÉE]RIE|SERIE)?/i) || texto.match(/(\d{6,9})/);
    return m ? m[1] : "";
  }

  function textoPorLinhas(textContent) {
    const linhas = {};
    textContent.items.forEach((it) => {
      const y = Math.round(it.transform[5] / 3) * 3; // agrupa por faixa de Y (tolerância)
      if (!linhas[y]) linhas[y] = [];
      linhas[y].push(it.str);
    });
    return Object.keys(linhas)
      .map(Number)
      .sort((a, b) => b - a) // maior Y = topo da página primeiro
      .map((y) => linhas[y].join(" "))
      .join("\n");
  }

  // Pré-processa a imagem (escala de cinza + binarização por limiar de Otsu)
  // antes de mandar pro OCR. Isso ajuda muito em PDFs feitos por apps de
  // celular (CamScanner e similares), que costumam ter sombra, baixo
  // contraste e fundo irregular.
  function preprocessarImagemOCR(canvas) {
    const ctx = canvas.getContext("2d");
    const { width: w, height: h } = canvas;
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    const hist = new Array(256).fill(0);
    for (let i = 0; i < d.length; i += 4) {
      const gray = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
      d[i] = d[i + 1] = d[i + 2] = gray;
      hist[gray]++;
    }
    const total = w * h;
    let sum = 0;
    for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sumB = 0, wB = 0, maxVar = 0, threshold = 150;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (wB === 0) continue;
      const wF = total - wB;
      if (wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB;
      const mF = (sum - sumB) / wF;
      const varBetween = wB * wF * (mB - mF) * (mB - mF);
      if (varBetween > maxVar) { maxVar = varBetween; threshold = t; }
    }
    for (let i = 0; i < d.length; i += 4) {
      const v = d[i] > threshold ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  async function processarPdfNota(file) {
    setPdfErro(null);
    setPdfPreview(null);
    setPdfArquivoNome(file.name);
    setPdfStatus("Lendo arquivo PDF...");
    try {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      let textoCompleto = "";

      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const textContent = await page.getTextContent();
        let textoPagina = textoPorLinhas(textContent);

        if (textoPagina.replace(/\s/g, "").length < 80) {
          // Página sem camada de texto (digitalizada/foto) -> OCR
          const viewport = page.getViewport({ scale: 3.5 });
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext("2d");
          setPdfStatus(`PDF digitalizado detectado — preparando imagem da página ${n}/${pdf.numPages}...`);
          await page.render({ canvasContext: ctx, viewport }).promise;
          preprocessarImagemOCR(canvas);
          setPdfStatus(`Rodando OCR na página ${n}/${pdf.numPages} (pode levar até 1 minuto)...`);
          const { data } = await Tesseract.recognize(canvas, "por", {
            logger: (m) => {
              if (m.status === "recognizing text") {
                setPdfStatus(`Reconhecendo texto (OCR) — página ${n}/${pdf.numPages}... ${Math.round((m.progress || 0) * 100)}%`);
              }
            },
          });
          textoPagina = data.text;
        }
        textoCompleto += "\n" + textoPagina;
      }

      let itens = parseItensDanfe(textoCompleto);
      let usouFallback = false;
      if (itens.length === 0) {
        itens = parseItensFallback(textoCompleto);
        usouFallback = itens.length > 0;
      }
      const numero = extrairNumeroNota(textoCompleto);
      setPdfStatus(null);

      if (itens.length === 0) {

        setPdfPreview({ itens: [], numero });
      } else {
        setPdfPreview({ itens, numero });
        if (usouFallback) {
          setPdfErro("Os itens foram identificados com um modo de leitura mais flexível — revise com atenção os códigos, descrições e quantidades abaixo antes de confirmar, pois a chance de erro é maior nesse modo.");
        }
      }
    } catch (err) {
      console.error(err);
      setPdfStatus(null);
      setPdfErro("Erro ao processar o PDF: " + err.message);
    }

  async function confirmarImportacaoPdf() {
    if (!pdfPreview) return;
    const itensValidos = pdfPreview.itens.filter(it => it.incluir && it.codigo && Number(it.quantidade) > 0);
    if (itensValidos.length === 0) {
      setPdfErro("Nenhum item válido para importar. Verifique código e quantidade dos itens.");
      return;
    }
    const empresaIdAtual = notaEmpresaSel ? notaEmpresaSel : (empresas[0]?.id || null);
    const fornecedorIdAtual = notaFornecedorSel ? notaFornecedorSel : (fornecedores[0]?.id || null);
    const hoje = new Date().toISOString().slice(0, 10);

    try {
      for (const item of itensValidos) {
        const qtd = Number(item.quantidade);
        const existente = produtos.find(p => (p.sku || "").toLowerCase() === String(item.codigo).toLowerCase());
        let produtoId;
        if (existente) {
          const { error } = await supabaseClient.from("estoque").update({ qtd: existente.qtd + qtd }).eq("id", existente.id);
          if (error) throw error;
          produtoId = existente.id;
        } else {
          const { data, error } = await supabaseClient.from("estoque").insert({
            sku: item.codigo, produto: item.descricao || `Produto ${item.codigo}`,
            fornecedor_id: fornecedorIdAtual, empresa_id: empresaIdAtual,
            unidade: item.unidade || "UN", fileira: 1, porta: "A", nivel: 1,
            localizacao: "1-A-1", qtd, qtd_min: 0, qtd_max: 0, status: "Ativo",
          }).select().single();
          if (error) throw error;
          produtoId = data.id;
        }
        const { error: errMov } = await supabaseClient.from("entradas").insert({
          produto_id: produtoId, quantidade: qtd,
          numero_nf: pdfPreview.numero || modalNota?.numero || "",
          observacoes: existente ? "Importado automaticamente via PDF da NF (item já existente)" : "Produto novo cadastrado automaticamente via PDF da NF",
          usuario: usuarioLogado.email,
        });
        if (errMov) throw errMov;
      }
      await recarregarTudo();
      setPdfPreview(null);
      setPdfErro(null);
      setPdfStatus(`${itensValidos.length} item(ns) lançado(s) no estoque com sucesso a partir da NF.`);
      setTimeout(() => setPdfStatus(null), 5000);
    } catch (e) {
      setPdfErro("Erro ao lançar itens no estoque: " + e.message);
    }

  async function processarScanSeparacao(codigoBruto, quantidadeManual) {
    if (!pedidoSeparAtivo || !codigoBruto || !codigoBruto.trim()) return;
    const codigo = codigoBruto.trim();
    const qtdAdicional = Math.max(1, Math.floor(Number(quantidadeManual) || 1));
    const itens = getItensDoPedidoSepar(pedidoSeparAtivo.id);
    const item = itens.find(it =>
      (it.sku && it.sku.toLowerCase() === codigo.toLowerCase()) ||
      (it.codigoBarras && String(it.codigoBarras).toLowerCase() === codigo.toLowerCase()) ||
      String(it.produtoId) === codigo
    );
    if (!item) {
      tocarSom("erro");
      setScanMsgSepar({ tipo: "erro", texto: `Produto "${codigo}" não pertence a este pedido.` });
      return;
    }
    if (item.quantidadeBipada >= item.quantidade) {
      tocarSom("erro");
      setScanMsgSepar({ tipo: "excesso", texto: `Quantidade excedida para: ${item.descricao}` });
      return;
    }
    const novaQtd = item.quantidadeBipada + qtdAdicional;
    if (novaQtd > item.quantidade) {
      tocarSom("erro");
      setScanMsgSepar({ tipo: "excesso", texto: `Quantidade excedida para: ${item.descricao} — restam apenas ${item.quantidade - item.quantidadeBipada}, você tentou adicionar ${qtdAdicional}.` });
      return;
    }
    setItensSeparacaoPorPedido(prev => ({
      ...prev,
      [pedidoSeparAtivo.id]: (prev[pedidoSeparAtivo.id] || []).map(it => it.id === item.id ? { ...it, quantidadeBipada: novaQtd } : it),
    }));
    const completo = novaQtd >= item.quantidade;
    tocarSom(completo ? "completo" : "ok");
    setScanMsgSepar({ tipo: "ok", texto: `✓ ${item.descricao} +${qtdAdicional}${completo ? " — COMPLETO!" : ` (${novaQtd}/${item.quantidade})`}` });
    setScanQtdSepar(1);
    const { error } = await supabaseClient.from("itens_pedidos_separacao").update({ quantidade_bipada: novaQtd }).eq("id", item.id);
    if (error) {
      // reverte otimisticamente se a gravação falhar
      setItensSeparacaoPorPedido(prev => ({
        ...prev,
        [pedidoSeparAtivo.id]: (prev[pedidoSeparAtivo.id] || []).map(it => it.id === item.id ? { ...it, quantidadeBipada: item.quantidadeBipada } : it),
      }));
      tocarSom("erro");
      setScanMsgSepar({ tipo: "erro", texto: "Erro ao registrar leitura: " + error.message });
      return;
    }
    await supabaseClient.from("logs_separacao").insert({
      pedido_id: pedidoSeparAtivo.id, numero_pedido: pedidoSeparAtivo.numeroPedido,
      usuario: usuarioLogado.email, acao: "Produto bipado", produto: item.descricao, quantidade: qtdAdicional,
    });
  }

                <Field label="CNPJ"><input name="cnpj" style={inputStyle} placeholder="00.000.000/0000-00" /></Field>
                {quickAdd.tipo === "fornecedor" && (
                  <div style={{ display: "flex", gap: 10 }}>

                    <Field label="Telefone"><input name="telefone" style={inputStyle} /></Field>

              <Btn onClick={() => setQuickAdd(null)}>Cancelar</Btn>
            </div>
          </form>
        </Modal>

      {/* MODAL: Entrada (produto existente OU produto novo + fornecedor + porta-palete, tudo aqui) */}
      {modalEntrada && (() => {
        const iconBtn = { background: "#1B2433", border: "1px solid #2A3445", borderRadius: 8, color: "#D2A256", cursor: "pointer", width: 40, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" };

        const prodSel = produtos.find(p => String(p.id) === String(entradaProdutoId));
        const campoPP = (
          <div style={{ display: "flex", gap: 6 }}>
            <select value={entradaPPSel} onChange={e => escolherPPNaEntrada(e.target.value)} style={{ flex: 1, minWidth: 0 }}>
              <option value="">{entradaModo === "novo" ? "Selecione ou preencha abaixo" : "Manter localização atual"}</option>

            </select>
            <button type="button" title="Nova porta-palete"
              onClick={() => abrirQuickAdd("portapalete", pp => escolherPPNaEntrada(String(pp.id)))}
              style={{ ...iconBtn, width: 34 }}>
              <Icon name="plus" size={15} />
            </button>
          </div>
        );
        return (
        <Modal title="Registrar entrada de produto" onClose={() => setModalEntrada(false)} width={entradaModo === "novo" ? 600 : 480}>
          <form onSubmit={e => {
            e.preventDefault();
            const f = new FormData(e.target);
            registrarEntradaCompleta({
              quantidade: f.get("quantidade"),
              numeroNf: f.get("numeroNf"),
              obs: f.get("obs"),
              sku: f.get("sku"), nome: f.get("nome"), unidade: f.get("unidade"),
              categoria: f.get("categoria"), marca: f.get("marca"),
              min: f.get("min"), max: f.get("max"),
            });
          }}>
            <div style={{ display: "flex", gap: 4, marginBottom: 16, background: "#1B2433", border: "1px solid #2A3445", borderRadius: 10, padding: 4 }}>
              {[["existente", "Produto já cadastrado"], ["novo", "+ Produto novo"]].map(([id, label]) => (
                <button key={id} type="button" onClick={() => { setEntradaModo(id); setEntradaErro(""); }}
                  style={{ flex: 1, padding: "8px 10px", borderRadius: 7, border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 13.5, fontWeight: 600,
                    background: entradaModo === id ? "#D2A256" : "transparent", color: entradaModo === id ? "#1A1408" : "#8893A6" }}>
                  {label}
                </button>
              ))}
            </div>

            {entradaModo === "existente" ? (
              <>
                <Field label="Produto">
                  <div style={{ display: "flex", gap: 6 }}>
                    <div style={{ flex: 1 }}>
                      <ProdutoBuscaSelect produtos={produtos} value={entradaProdutoId} onChange={setEntradaProdutoId} onCadastrarNovo={cadastrarNovoDaBusca} />
                    </div>
                    <button type="button" title="Bipar código de barras" onClick={() => setScannerAlvo("entrada")} style={iconBtn}>
                      <Icon name="camera" size={16} />
                    </button>
                  </div>
                </Field>
                {prodSel && (
                  <div style={{ fontSize: 12.5, color: "#8893A6", marginTop: -6, marginBottom: 14, lineHeight: 1.6 }}>
                    Fornecedor: <b style={{ color: "#AEB7C7" }}>{fornecedorNome(prodSel.fornecedorId)}</b> · Localização atual: <b style={{ color: "#6FB0E0", fontFamily: "monospace" }}>{prodSel.localizacao || [prodSel.fileira, prodSel.porta, prodSel.nivel].filter(Boolean).join("-") || "—"}</b> · Em estoque: <b style={{ color: "#AEB7C7" }}>{prodSel.qtd}</b>
                  </div>
                )}
                <Field label="Porta-palete (opcional — só se estiver guardando em outra)">{campoPP}</Field>
              </>
            ) : (
              <>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}><Field label="SKU"><input name="sku" required style={inputStyle} /></Field></div>
                  <div style={{ width: 110 }}><Field label="Unidade"><input name="unidade" defaultValue="UN" required style={inputStyle} /></Field></div>
                </div>
                <Field label="Nome do produto"><input name="nome" value={entradaNovoNome} onChange={e => setEntradaNovoNome(e.target.value)} required style={inputStyle} autoFocus /></Field>
                <Field label="Código de barras (opcional)">
                  <div style={{ display: "flex", gap: 6 }}>
                    <input value={produtoCodBarras} onChange={e => setProdutoCodBarras(e.target.value)} placeholder="Bipar ou digitar o código" style={{ ...inputStyle, fontFamily: "monospace" }} />
                    <button type="button" title="Bipar código de barras" onClick={() => setScannerAlvo("produto")} style={iconBtn}>
                      <Icon name="camera" size={16} />
                    </button>
                  </div>
                </Field>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}>
                    <Field label="Fornecedor">
                      <div style={{ display: "flex", gap: 6 }}>
                        <select value={entradaFornecedorSel} onChange={e => setEntradaFornecedorSel(e.target.value)} style={{ flex: 1, minWidth: 0 }}>
                          <option value="">Selecione</option>
                          {fornecedores.map(f => <option key={f.id} value={f.id}>{f.nomeFantasia}</option>)}
                        </select>
                        <button type="button" title="Novo fornecedor" onClick={() => abrirQuickAdd("fornecedor", id => setEntradaFornecedorSel(String(id)))} style={{ ...iconBtn, width: 34 }}>
                          <Icon name="plus" size={15} />
                        </button>
                      </div>
                    </Field>
                  </div>
                  <div style={col}>
                    <Field label="Empresa">
                      <div style={{ display: "flex", gap: 6 }}>
                        <select value={entradaEmpresaSel} onChange={e => setEntradaEmpresaSel(e.target.value)} style={{ flex: 1, minWidth: 0 }}>
                          <option value="">Selecione</option>
                          {empresas.map(e => <option key={e.id} value={e.id}>{e.nomeFantasia}</option>)}
                        </select>
                        <button type="button" title="Nova empresa" onClick={() => abrirQuickAdd("empresa", id => setEntradaEmpresaSel(String(id)))} style={{ ...iconBtn, width: 34 }}>
                          <Icon name="plus" size={15} />
                        </button>
                      </div>
                    </Field>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}><Field label="Categoria (opcional)"><input name="categoria" style={inputStyle} /></Field></div>
                  <div style={col}><Field label="Código do fornecedor (opcional)"><input name="marca" style={{ ...inputStyle, fontFamily: "monospace" }} /></Field></div>
                </div>
                <div style={{ fontSize: 12.5, fontWeight: 700, color: "#D2A256", margin: "6px 0 8px" }}>Localização física</div>
                <Field label="Porta-palete">{campoPP}</Field>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}><Field label="Fileira"><input type="number" min="1" value={entradaFileira} onChange={e => { setEntradaFileira(e.target.value); setEntradaPPSel(""); }} style={inputStyle} /></Field></div>
                  <div style={col}><Field label="Porta"><input value={entradaPorta} onChange={e => { setEntradaPorta(e.target.value); setEntradaPPSel(""); }} style={inputStyle} placeholder="A" /></Field></div>
                  <div style={col}><Field label="Nível"><input type="number" min="1" max="3" value={entradaNivel} onChange={e => { setEntradaNivel(e.target.value); setEntradaPPSel(""); }} style={inputStyle} /></Field></div>
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}><Field label="Estoque mínimo"><input name="min" type="number" min="0" defaultValue="0" style={inputStyle} /></Field></div>
                  <div style={col}><Field label="Estoque máximo"><input name="max" type="number" min="0" defaultValue="0" style={inputStyle} /></Field></div>
                </div>
              </>
            )}

            <div style={{ borderTop: "1px solid #2A3445", margin: "6px 0 14px" }} />
            <Field label="Quantidade que está entrando"><input name="quantidade" type="number" min="1" required style={inputStyle} /></Field>
            <div style={{ display: "flex", gap: 10 }}>
              <div style={col}><Field label="Número da NF (opcional)"><input name="numeroNf" style={inputStyle} /></Field></div>
              <div style={col}><Field label="Observações"><input name="obs" style={inputStyle} /></Field></div>
            </div>

            {entradaErro && (
              <div style={{ background: "#3A1818", border: "1px solid #5C2424", color: "#E07A7A", borderRadius: 8, padding: "9px 12px", fontSize: 13, marginBottom: 6 }}>{entradaErro}</div>
            )}
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <Btn type="submit" variant="primary" style={salvandoEntrada ? { opacity: 0.6, pointerEvents: "none" } : undefined}>
                {salvandoEntrada ? "Salvando..." : entradaModo === "novo" ? "Cadastrar produto e confirmar entrada" : "Confirmar entrada"}
              </Btn>
              <Btn onClick={() => setModalEntrada(false)}>Cancelar</Btn>
            </div>
          </form>
        </Modal>
        );
      })()}

      {/* MODAL: Saída */}
      {modalSaida && (
        <Modal title="Registrar saída de produto" onClose={() => setModalSaida(false)}>
          <form onSubmit={e => {
            e.preventDefault();
            const f = new FormData(e.target);
            registrarSaida({
              produtoId: f.get("produtoId"),
              quantidade: f.get("quantidade"),
              destino: f.get("destino"),
              motivo: f.get("motivo"),
              ppId: f.get("ppId"),
            });
          }}>
            <Field label="Produto">
              <div style={{ display: "flex", gap: 6 }}>
                <div style={{ flex: 1 }}>
                  <ProdutoBuscaSelect produtos={produtos} value={saidaProdutoId} onChange={v => { setSaidaProdutoId(v); setSaidaPPSel(""); }}
                    getExtra={p => `${p.qtd} em estoque`} />
                </div>
                <input type="hidden" name="produtoId" value={saidaProdutoId} />
                <button type="button" title="Bipar código de barras" onClick={() => setScannerAlvo("saida")}
                  style={{ background: "#1B2433", border: "1px solid #2A3445", borderRadius: 8, color: "#D2A256", cursor: "pointer", width: 40, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <Icon name="camera" size={16} />
                </button>
              </div>
            </Field>
            {(() => {
              const prodSel = produtos.find(p => String(p.id) === String(saidaProdutoId));
              const dist = prodSel ? distribuicaoDoProduto(prodSel).filter(r => r.ppId) : [];
              if (dist.length === 0) return null;
              const valor = dist.some(r => String(r.ppId) === saidaPPSel) ? saidaPPSel : "";
              return (
                <Field label="Retirar de qual porta-palete?">
                  <select name="ppId" value={valor} onChange={e => setSaidaPPSel(e.target.value)} style={inputStyle}>
                    <option value="">Automático</option>
                    {dist.map(r => <option key={r.ppId} value={r.ppId}>{portaPaleteLabel(portaPaleteById(r.ppId))} — {r.qtd} un</option>)}
                  </select>
                </Field>
              );
            })()}
            <Field label="Quantidade"><input name="quantidade" type="number" min="1" required style={inputStyle} /></Field>
            <Field label="Destino / cliente"><input name="destino" style={inputStyle} /></Field>
            <Field label="Motivo"><input name="motivo" style={inputStyle} placeholder="Venda, transferência, perda..." /></Field>
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <Btn type="submit" variant="primary">Confirmar saída</Btn>
              <Btn onClick={() => setModalSaida(false)}>Cancelar</Btn>
            </div>
          </form>
        </Modal>
      )}

      {/* MODAL: Porta-palete (cadastro/edição) */}
      {modalPortaPalete && (
        <Modal title={modalPortaPalete.id ? "Editar porta-palete" : "Nova porta-palete"} onClose={() => setModalPortaPalete(null)}>
          <form onSubmit={e => {
            e.preventDefault();
            const f = new FormData(e.target);
            salvarPortaPalete({
              id: modalPortaPalete.id,
              codigo: f.get("codigo"),
              fileira: Number(f.get("fileira")),
              porta: f.get("porta"),
              nivel: Number(f.get("nivel")),
              descricao: f.get("descricao"),
            });
          }}>
            <Field label="Código de barras">
              <div style={{ display: "flex", gap: 8 }}>
                <input ref={codigoPortaPaleteRef} name="codigo" defaultValue={modalPortaPalete.codigo} required style={inputStyle} placeholder="Ex: PP-0001" />
                <button type="button" title="Bipar código de barras" onClick={() => setScannerAlvo("portapalete")}
                  style={{ background: "#1B2433", border: "1px solid #2A3445", borderRadius: 8, color: "#D2A256", cursor: "pointer", width: 40, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <Icon name="camera" size={16} />
                </button>
              </div>
            </Field>
            <div style={{ fontSize: 12, color: "#5C6678", marginTop: -10, marginBottom: 14 }}>
              É esse código que fica etiquetado na porta-palete física. Um leitor USB/Bluetooth digita normalmente nesse campo — o botão da câmera lê sem precisar de leitor físico.
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Field label="Fileira"><input name="fileira" type="number" min="1" defaultValue={modalPortaPalete.fileira} required style={inputStyle} /></Field>
              <Field label="Porta"><input name="porta" defaultValue={modalPortaPalete.porta} required style={inputStyle} placeholder="A" /></Field>
              <Field label="Nível"><input name="nivel" type="number" min="1" max="3" defaultValue={modalPortaPalete.nivel} required style={inputStyle} /></Field>
            </div>
            <Field label="Descrição (opcional)"><input name="descricao" defaultValue={modalPortaPalete.descricao} style={inputStyle} placeholder="Ex: Eletrônicos — SoundX" /></Field>
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <Btn type="submit" variant="primary">{modalPortaPalete.id ? "Salvar e gerenciar produtos" : "Salvar e adicionar produtos"}</Btn>
              <Btn onClick={() => setModalPortaPalete(null)}>Cancelar</Btn>
            </div>
          </form>
        </Modal>
      )}

      {/* MODAL: Ver / cadastrar produtos de uma porta-palete */}
      {modalVerProdutosPP && (() => {
        const pp = modalVerProdutosPP;
        const produtosNaPP = produtosDaPortaPalete(pp);
        const origensTransf = [];
        produtos.forEach(p => distribuicaoDoProduto(p).forEach(r => {
          if (r.ppId !== pp.id && r.qtd > 0) origensTransf.push({ p, ppId: r.ppId, qtd: r.qtd });
        }));
        return (
          <Modal title={`Produtos em ${pp.codigo} · ${portaPaleteLabel(pp)}`} onClose={() => setModalVerProdutosPP(null)} width={560}>
            {produtosNaPP.length === 0 && (
              <div style={{ color: "#5C6678", fontSize: 13.5, padding: "10px 0 18px" }}>Nenhum produto cadastrado nesta porta-palete ainda.</div>
            )}
            {produtosNaPP.length > 0 && (
              <div style={{ border: "1px solid #2A3445", borderRadius: 10, overflow: "hidden", marginBottom: 18 }}>
                <table>
                  <thead><tr><th>Produto</th><th>SKU</th><th>Qtd aqui</th><th></th></tr></thead>
                  <tbody>
                    {produtosNaPP.map(p => (
                      <tr key={p.id}>
                        <td style={{ fontWeight: 600 }}>{p.nome}</td>
                        <td style={{ fontFamily: "monospace", fontSize: 12.5, color: "#8893A6" }}>{p.sku}</td>
                        <td>
                          <button onClick={() => ajustarQtdNaPP(p, pp)} title="Corrigir a quantidade nesta porta-palete" style={{ background: "none", border: "none", borderBottom: "1px dashed #8893A6", color: "inherit", cursor: "pointer", fontWeight: 700, fontSize: "inherit", padding: 0 }}>{p.qtdPP}</button>
                          {p.qtd !== p.qtdPP && <span style={{ color: "#8893A6", fontSize: 11 }}> (total {p.qtd})</span>}
                        </td>
                        <td>
                          <button onClick={() => { setModalVerProdutosPP(null); abrirModalProduto(p); }} style={{ background: "none", border: "none", color: "#8893A6", cursor: "pointer" }}><Icon name="edit" size={14} /></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            <div style={{ fontSize: 12.5, fontWeight: 700, color: "#D2A256", marginBottom: 10 }}>Mover quantidade pra cá</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <select ref={moverProdutoRef} style={{ flex: 1, minWidth: 0 }} disabled={origensTransf.length === 0}>
                {origensTransf.length === 0 && <option>Nenhum produto com estoque em outra porta-palete</option>}
                {origensTransf.map(o => (
                  <option key={`${o.p.id}-${o.ppId || "x"}`} value={`${o.p.id}:${o.ppId || ""}`}>
                    {o.p.nome} ({o.p.sku}) — em {o.ppId ? portaPaleteLabel(portaPaleteById(o.ppId)) : "sem porta-palete"}: {o.qtd} un
                  </option>
                ))}
              </select>
              <input ref={moverQtdRef} type="number" min="1" placeholder="Qtd" disabled={origensTransf.length === 0} style={{ ...inputStyle, width: 90 }} />
              <Btn disabled={origensTransf.length === 0} onClick={() => {
                const sel = moverProdutoRef.current;
                if (!sel || !sel.value) return;
                const [pid, origem] = sel.value.split(":");
                transferirParaPP(pid, origem ? Number(origem) : null, pp.id, moverQtdRef.current ? moverQtdRef.current.value : 0);
                if (moverQtdRef.current) moverQtdRef.current.value = "";
              }}>Mover pra cá</Btn>
            </div>
            <div style={{ fontSize: 12, color: "#5C6678", marginBottom: 16 }}>
              Produto já cadastrado em outra porta-palete? Escolha de onde tirar, digite quantas unidades e mova pra cá. O estoque total não muda.
            </div>

            <Btn variant="primary" icon="plus" style={{ width: "100%", justifyContent: "center" }}
              onClick={() => { setModalVerProdutosPP(null); abrirModalProduto({ fileira: pp.fileira, porta: pp.porta, nivel: pp.nivel }); }}>
              Cadastrar produto novo nesta porta-palete
            </Btn>
          </Modal>
        );
      })()}

      {/* MODAL: Scanner de código de barras */}
      {scannerAlvo && (
        <BarcodeScannerModal onDetected={handleBarcodeDetected} onClose={() => setScannerAlvo(null)} />
      )}

      {/* MODAL: Confirmar exclusão */}
      {confirmDelete && (
        <Modal title="Confirmar exclusão" onClose={() => setConfirmDelete(null)} width={380}>
          <p style={{ color: "#AEB7C7", fontSize: 14, marginBottom: 18 }}>
            Tem certeza que deseja excluir <b style={{ color: "#F3EFE6" }}>{confirmDelete.label}</b>? Essa ação não pode ser desfeita.
          </p>
          <div style={{ display: "flex", gap: 10 }}>
            <Btn variant="danger" onClick={executarExclusao}>Excluir</Btn>
            <Btn onClick={() => setConfirmDelete(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

 function TelaLogin() {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [entrando, setEntrando] = useState(false);

  async function entrar(e) {
    e.preventDefault();
    setErro("");
    setEntrando(true);
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: email.trim().toLowerCase(),
      password: senha,
    });
    setEntrando(false);
    if (error) {
      setErro("E-mail ou senha incorretos.");
    }
  }

  useEffect(() => {
    const wrap = document.getElementById("feed-lines");
    if (!wrap) return;
    const templates = [
      () => `baixa registrada · <b>-${1 + Math.floor(Math.random() * 4)} un</b>`,
      () => `entrada registrada · <b>+${10 + Math.floor(Math.random() * 60)} un</b>`,
      () => `nota fiscal vinculada`,
      () => `estoque abaixo do mínimo`,
      () => `fornecedor atualizado`,
      () => `pedido despachado`,
    ];
    const MAX_LINES = 5;
    function pad(n) { return n.toString().padStart(2, "0"); }
    function nowStamp() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
    function randomSku() { return "SK-" + (2100 + Math.floor(Math.random() * 300)); }
    function pushLine() {
      const sku = randomSku();
      const txt = templates[Math.floor(Math.random() * templates.length)]();
      const line = document.createElement("div");
      line.className = "feed-line";
      line.innerHTML = `<span class="t">${nowStamp()}</span><span class="ev"><b>${sku}</b> — ${txt}</span>`;
      wrap.insertBefore(line, wrap.firstChild);
      while (wrap.children.length > MAX_LINES) { wrap.removeChild(wrap.lastChild); }
    }
    for (let i = 0; i < MAX_LINES; i++) { pushLine(); }
    const interval = setInterval(pushLine, 2400);
    return () => clearInterval(interval);
  }, []);

  return (
    <div id="login-screen-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        #login-screen-root { font-family:'Public Sans', sans-serif; background:#0B1220; color:#EAF0F5; min-height:100vh; }
        #login-screen { display:grid; grid-template-columns: 1.05fr 1fr; min-height:100vh; }
        @media (max-width:900px){ #login-screen{ grid-template-columns:1fr; } .console-panel{ display:none; } }
        .console-panel{ position:relative; overflow:hidden; padding:52px 56px;
          background: linear-gradient(180deg, rgba(11,18,32,0.2), #0B1220 70%),
            repeating-linear-gradient(90deg, rgba(234,240,245,0.025) 0 1px, transparent 1px 84px),
            repeating-linear-gradient(0deg, rgba(234,240,245,0.025) 0 1px, transparent 1px 84px),
            radial-gradient(ellipse at 20% 0%, rgba(255,138,61,0.14), transparent 55%);
          display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid rgba(234,240,245,0.08); }
