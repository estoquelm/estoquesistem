  // ==== SEPARAÇÃO POR PORTA-PALETE: lógica de bipagem e baixa automática ====
  function handleScanPP(raw) {
    try {
    if (!raw || !raw.trim()) return;
    const val = raw.trim();
    setScanInputPP("");

    // 1) Tenta interpretar como código de barras de uma porta-palete
    const pp = portaPaleteByCodigo(val);
    setSepPPConcluida(false);
    if (pp) {
      const prodsNaPP = produtosDaPortaPalete(pp);
      setScanPortaPaletePP({ id: pp.id, codigo: pp.codigo, local: portaPaleteLabel(pp), produtos: prodsNaPP });
      setSepMsgPP(prodsNaPP.length > 0
        ? { tipo: "info", texto: `Porta-palete ${pp.codigo} (${portaPaleteLabel(pp)}) — ${prodsNaPP.length} produto(s) encontrado(s)` }
        : { tipo: "erro", texto: `Porta-palete ${pp.codigo} não tem produtos cadastrados.` });
      return;
    }

    // 2) Tenta interpretar como código de barras ou SKU de um produto
    const prod = produtos.find(p =>
      (p.codigoBarras && String(p.codigoBarras).toUpperCase() === val.toUpperCase()) ||
      (p.sku && p.sku.toUpperCase() === val.toUpperCase())
    );
    if (prod) {
      const ppAtivo = scanPortaPaletePP ? portaPaleteById(scanPortaPaletePP.id) : null;
      if (ppAtivo && qtdNaPP(prod, ppAtivo.id) <= 0) {
        const onde = distribuicaoDoProduto(prod).map(r => `${r.ppId ? portaPaleteLabel(portaPaleteById(r.ppId)) : "sem porta-palete"} (${r.qtd} un)`).join(", ");
        setSepMsgPP({ tipo: "erro", texto: `${prod.nome} não tem estoque em ${portaPaleteLabel(ppAtivo)}${onde ? ` — está em: ${onde}` : ""}. Bipe o porta-palete correto.` });
        return;
      }
      const origemTxt = ppAtivo ? ` de ${portaPaleteLabel(ppAtivo)}` : "";
      if (sepQtdModoPP === "bip") {
        adicionarSepPP(prod, 1);
        const emVarios = !ppAtivo && distribuicaoDoProduto(prod).filter(r => r.ppId).length > 1;
        setSepMsgPP({ tipo: emVarios ? "info" : "ok", texto: `+1 unidade de ${prod.nome} (${prod.sku})${origemTxt}${emVarios ? " — este produto está em mais de um porta-palete: escolha de qual retirar na lista ao lado." : ""}` });
      } else {
        const qtdStr = window.prompt(`Quantidade de "${prod.nome}" a separar${origemTxt}:`);
        const qtd = parseInt(qtdStr);
        if (qtd > 0) {
          adicionarSepPP(prod, qtd);
          setSepMsgPP({ tipo: "ok", texto: `${qtd}x ${prod.nome} adicionado(s) à separação${origemTxt}` });
        }
      }
      return;
    }

    setSepMsgPP({ tipo: "erro", texto: `Código "${val}" não reconhecido como porta-palete nem como produto.` });
    } catch (e) {
      console.error("Erro ao processar scan:", e);
      setSepMsgPP({ tipo: "erro", texto: "Erro ao processar o código lido. Tente novamente." });
    }
  }

  // Adiciona item à lista de separação. Se há um porta-palete bipado, a baixa sai DELE (e só dele).
  function adicionarSepPP(prod, qtdAdd) {
    const ppAtivo = scanPortaPaletePP ? portaPaleteById(scanPortaPaletePP.id) : null;
    const ppId = ppAtivo ? ppAtivo.id : null;
    const locais = distribuicaoDoProduto(prod).map(r => `${r.ppId ? portaPaleteLabel(portaPaleteById(r.ppId)) : "sem porta-palete"}: ${r.qtd} un`);
    const estoqueAtual = ppId ? qtdNaPP(prod, ppId) : prod.qtd;
    setItensSeparPP(prev => {
      const ex = ppId
        ? prev.find(i => i.produtoId === prod.id && (i.ppId || null) === ppId)
        : prev.find(i => i.produtoId === prod.id);
      if (ex) return prev.map(i => i === ex ? { ...i, qtd: i.qtd + qtdAdd } : i);
      return [...prev, { produtoId: prod.id, ppId, ppLabel: ppAtivo ? portaPaleteLabel(ppAtivo) : "", nome: prod.nome, sku: prod.sku, qtd: qtdAdd, estoqueAtual, locais }];
    });
  }

  // Troca de qual porta-palete um item da lista vai sair ("" = automático)
  function trocarPPItemSepPP(idx, novoPpId) {
    setItensSeparPP(prev => {
      const item = prev[idx];
      if (!item) return prev;
      const prod = produtos.find(p => p.id === item.produtoId);
      const ppId = novoPpId ? Number(novoPpId) : null;
      const pp = ppId ? portaPaleteById(ppId) : null;
      const atualizado = {
        ...item, ppId, ppLabel: pp ? portaPaleteLabel(pp) : "",
        estoqueAtual: prod ? (ppId ? qtdNaPP(prod, ppId) : prod.qtd) : item.estoqueAtual,
      };
      // se já existe outro item igual (mesmo produto e mesmo porta-palete), junta os dois
      const outro = prev.findIndex((i, ii) => ii !== idx && i.produtoId === item.produtoId && (i.ppId || null) === ppId);
      if (outro >= 0) {
        return prev
          .map((i, ii) => ii === outro ? { ...i, qtd: i.qtd + item.qtd } : i)
          .filter((_, ii) => ii !== idx);
      }
      return prev.map((i, ii) => ii === idx ? atualizado : i);
    });
  }

  function adicionarItemSepPP(p) {
    setSepPPConcluida(false);
    if (sepQtdModoPP === "bip") {
      adicionarSepPP(p, 1);
      setSepMsgPP({ tipo: "ok", texto: `+1 de ${p.nome}` });
    } else {
      const qtdStr = window.prompt(`Quantidade de "${p.nome}":`);
      const qtd = parseInt(qtdStr);
      if (qtd > 0) {
        adicionarSepPP(p, qtd);
        setSepMsgPP({ tipo: "ok", texto: `${qtd}x ${p.nome} adicionado` });
      }
    }
  }

  // Finaliza a separação: dá baixa automática no estoque (tabela "estoque") e registra
  // cada item como uma saída (tabela "saidas"), exatamente como a saída manual já faz.
  async function finalizarSepPP() {
    if (itensSeparPP.length === 0 || finalizandoSeparPP) return;
    const erros = itensSeparPP.filter(i => i.qtd > i.estoqueAtual);
    if (erros.length > 0) {
      setSepMsgPP({ tipo: "erro", texto: `Estoque insuficiente: ${erros.map(e => e.nome).join(", ")}` });
      return;
    }
    setFinalizandoSeparPP(true);
    try {
      // A baixa (estoque total + porta-palete + saídas) é feita de uma vez no banco, com trava:
      // se dois celulares baixarem o mesmo produto ao mesmo tempo, nenhuma baixa se perde.
      const { error } = await supabaseClient.rpc("baixar_separacao_pp", {
        p_itens: itensSeparPP.map(i => ({ produto_id: i.produtoId, pp_id: i.ppId || null, qtd: i.qtd })),
        p_usuario: usuarioLogado.email,
      });
      if (error) {
        setSepMsgPP({ tipo: "erro", texto: "Nada foi baixado: " + error.message });
        await recarregarTudo();
        return;
      }
      await recarregarTudo();
      setSepMsgPP({ tipo: "ok", texto: `✓ Separação finalizada! Baixa dada em ${itensSeparPP.length} produto(s).` });
      setItensSeparPP([]); setSepPPConcluida(true);
      setScanPortaPaletePP(null);
    } catch (e) {
      setSepMsgPP({ tipo: "erro", texto: "Erro ao finalizar separação: " + e.message });
    } finally {
      setFinalizandoSeparPP(false);
    }
  }

  function parseNumeroBR(str) {
    if (!str) return 0;
    let s = String(str).trim();
    s = s.replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function parseItensDanfe(textoOriginal) {
    // Remove ruído típico de OCR (bordas de tabela reconhecidas como | [ ] { })
    // mas preserva quebras de linha, que ajudam a separar um item do outro
    // e a recuperar códigos que quebram em duas linhas na coluna COD.PROD.
    const linhas = textoOriginal
      .replace(/[|\[\]{}]/g, " ")
      .split(/[\r\n]+/)
      .map((l) => l.replace(/\s+/g, " ").trim())
      .filter(Boolean);

    const itens = [];
    // COD.PROD  DESCRIÇÃO ... NCM/SH(7-8 díg.) ... UN  QUANT.  [V.UNITARIO] ...
    // Entre NCM e UN aceitamos qualquer ruído (CST/CFOP às vezes saem
    // corrompidos do OCR), por isso usamos .*? em vez de exigir os
    // dígitos exatos de CST e CFOP.
    const rowRegex = /^(\d{8,14})\s+(.+?)\s+(\d{7,8})\s+.*?\b([A-Z]{2,4})\b\s+([\d.,]{1,12})(?:\s+([\d.,]{1,12}))?/;

    for (let i = 0; i < linhas.length; i++) {
      const m = linhas[i].match(rowRegex);
      if (!m) continue;
      const quantidade = parseNumeroBR(m[5]);
      if (quantidade <= 0) continue;

      let codigo = m[1];
      // Se a linha seguinte for só um fragmento curto de dígitos (sufixo do
      // código que quebrou de linha na coluna COD.PROD), anexa ao código.
      const proxima = linhas[i + 1];
      if (proxima && proxima.length <= 8 && !/^\d{8,14}\s/.test(proxima)) {
        const sufixo = proxima.match(/^(\d{1,4})(?:\D|$)/);
        if (sufixo) codigo += sufixo[1];
      }

      itens.push({
        id: Math.random().toString(36).slice(2),
        codigo,
        descricao: m[2].replace(/[-–]\s*$/, "").trim(),
        unidade: m[4],
        quantidade,
        valorUnitario: m[6] ? parseNumeroBR(m[6]) : 0,
        incluir: true,
      });
    }
    return itens;
  }

  // Parser alternativo, mais tolerante, usado quando o layout padrão de DANFE
  // não é reconhecido (comum em PDFs gerados por apps de scanner como o
  // CamScanner, onde o OCR sai com colunas desalinhadas, sem NCM legível etc.)
  function parseItensFallback(textoOriginal) {
    const linhas = textoOriginal
      .replace(/[|\[\]{}]/g, " ")
      .split(/[\r\n]+/)
      .map((l) => l.replace(/\s+/g, " ").trim())
      .filter(Boolean);

    const itens = [];
    // CÓDIGO (alfanumérico) ... DESCRIÇÃO (texto) ... [UN] QTD no fim da linha
    const looseRegex = /^([A-Z0-9][A-Z0-9.\-\/]{2,15})\s+(.{3,70}?)\s+(?:UN|UND|UNI|UNID|PC|PCT|CX|KG|MT|LT)?\.?\s*[:\-]?\s*(\d{1,4}(?:[.,]\d{1,3})?)\s*(?:UN|UND|UNI|UNID|PC|PCT|CX)?\s*$/i;

    for (const l of linhas) {
      // ignora linhas claramente de cabeçalho/rodapé/totais
      if (/total|subtotal|cnpj|endere|telefone|emiss|chave de acesso|valor a pagar/i.test(l)) continue;
      const m = l.match(looseRegex);
      if (!m) continue;
      const quantidade = parseNumeroBR(m[3]);
      if (quantidade <= 0 || quantidade > 99999) continue;
      const descricao = m[2].replace(/[-–]\s*$/, "").trim();
      if (descricao.length < 3) continue;
      itens.push({
        id: Math.random().toString(36).slice(2),
        codigo: m[1],
        descricao,
        unidade: "UN",
        quantidade,
        valorUnitario: 0,
        incluir: true,
      });
    }
    return itens;
  }

  function extrairNumeroNota(texto) {
    const m = texto.match(/N\.?\s*0*?(\d{4,9})\s*(?:S[ÉE]RIE|SERIE)?/i) || texto.match(/(\d{6,9})/);
    return m ? m[1] : "";
  }

  function textoPorLinhas(textContent) {
    const linhas = {};
    textContent.items.forEach((it) => {
      const y = Math.round(it.transform[5] / 3) * 3; // agrupa por faixa de Y (tolerância)
      if (!linhas[y]) linhas[y] = [];
      linhas[y].push(it.str);
    });
    return Object.keys(linhas)
      .map(Number)
      .sort((a, b) => b - a) // maior Y = topo da página primeiro
      .map((y) => linhas[y].join(" "))
      .join("\n");
  }

  // Pré-processa a imagem (escala de cinza + binarização por limiar de Otsu)
  // antes de mandar pro OCR. Isso ajuda muito em PDFs feitos por apps de
  // celular (CamScanner e similares), que costumam ter sombra, baixo
  // contraste e fundo irregular.
  function preprocessarImagemOCR(canvas) {
    const ctx = canvas.getContext("2d");
    const { width: w, height: h } = canvas;
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    const hist = new Array(256).fill(0);
    for (let i = 0; i < d.length; i += 4) {
      const gray = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
      d[i] = d[i + 1] = d[i + 2] = gray;
      hist[gray]++;
    }
    const total = w * h;
    let sum = 0;
    for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sumB = 0, wB = 0, maxVar = 0, threshold = 150;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (wB === 0) continue;
      const wF = total - wB;
      if (wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB;
      const mF = (sum - sumB) / wF;
      const varBetween = wB * wF * (mB - mF) * (mB - mF);
      if (varBetween > maxVar) { maxVar = varBetween; threshold = t; }
    }
    for (let i = 0; i < d.length; i += 4) {
      const v = d[i] > threshold ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  async function processarPdfNota(file) {
    setPdfErro(null);
    setPdfPreview(null);
    setPdfArquivoNome(file.name);
    setPdfStatus("Lendo arquivo PDF...");
    try {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      let textoCompleto = "";

      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const textContent = await page.getTextContent();
        let textoPagina = textoPorLinhas(textContent);

        if (textoPagina.replace(/\s/g, "").length < 80) {
          // Página sem camada de texto (digitalizada/foto) -> OCR
          const viewport = page.getViewport({ scale: 3.5 });
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext("2d");
          setPdfStatus(`PDF digitalizado detectado — preparando imagem da página ${n}/${pdf.numPages}...`);
          await page.render({ canvasContext: ctx, viewport }).promise;
          preprocessarImagemOCR(canvas);
          setPdfStatus(`Rodando OCR na página ${n}/${pdf.numPages} (pode levar até 1 minuto)...`);
          const { data } = await Tesseract.recognize(canvas, "por", {
            logger: (m) => {
              if (m.status === "recognizing text") {
                setPdfStatus(`Reconhecendo texto (OCR) — página ${n}/${pdf.numPages}... ${Math.round((m.progress || 0) * 100)}%`);
              }
            },
          });
          textoPagina = data.text;
        }
        textoCompleto += "\n" + textoPagina;
      }

      let itens = parseItensDanfe(textoCompleto);
      let usouFallback = false;
      if (itens.length === 0) {
        itens = parseItensFallback(textoCompleto);
        usouFallback = itens.length > 0;
      }
      const numero = extrairNumeroNota(textoCompleto);
      setPdfStatus(null);

      if (itens.length === 0) {
        setPdfErro("Não consegui identificar itens automaticamente neste PDF. Isso pode acontecer com fotos de baixa qualidade, mal enquadradas ou com texto cortado. Confira/adicione os itens manualmente abaixo, ou tente escanear a nota novamente (luz uniforme, sem sombra, texto reto e dentro do enquadramento).");
        setPdfPreview({ itens: [], numero });
      } else {
        setPdfPreview({ itens, numero });
        if (usouFallback) {
          setPdfErro("Os itens foram identificados com um modo de leitura mais flexível — revise com atenção os códigos, descrições e quantidades abaixo antes de confirmar, pois a chance de erro é maior nesse modo.");
        }
      }
    } catch (err) {
      console.error(err);
      setPdfStatus(null);
      setPdfErro("Erro ao processar o PDF: " + err.message);
    }
  }

  // ==== SEPARAÇÃO DE PEDIDOS: carregamento (isolado do recarregarTudo original) ====
  async function recarregarSeparacao() {
    try {
      const [pedRows, itRows, alocRows, logRes] = await Promise.all([
        buscarTodos("pedidos_separacao", "created_at", false),
        buscarTodos("itens_pedidos_separacao", "id"),
        buscarTodos("itens_separacao_alocacao", "id"),
        supabaseClient.from("logs_separacao").select("*").order("data", { ascending: false }).limit(500),
      ]);
      if (logRes.error) throw logRes.error;
      setPedidosSeparacao(pedRows.map(rowToPedidoSeparacao));
      const agrupado = {};
      itRows.map(rowToItemSeparacao).forEach(it => {
        if (!agrupado[it.pedidoId]) agrupado[it.pedidoId] = [];
        agrupado[it.pedidoId].push(it);
      });
      setItensSeparacaoPorPedido(agrupado);
      setPpAlocSepar(alocacoesParaMapa(alocRows));
      const novosLogs = (logRes.data || []).map(rowToLogSeparacao);
      // mantém o histórico completo do pedido aberto (carregado à parte)
      setLogsSeparacao(prev => {
        const ids = new Set(novosLogs.map(l => l.id));
        return [...novosLogs, ...prev.filter(l => !ids.has(l.id) && pedidoAbertoRef.current && l.pedidoId === pedidoAbertoRef.current)];
      });
    } catch (e) {
      console.error("Erro ao carregar dados de separação de pedidos:", e);
    } finally {
      setCarregandoSeparacao(false);
    }
  }

  // Histórico completo de um pedido (o carregamento geral traz só os 500 registros mais recentes)
  async function carregarHistoricoPedido(pedidoId) {
    const { data, error } = await supabaseClient.from("logs_separacao").select("*").eq("pedido_id", pedidoId).order("data", { ascending: false }).limit(2000);
    if (error) return;
    const doPedido = (data || []).map(rowToLogSeparacao);
    setLogsSeparacao(prev => {
      const ids = new Set(doPedido.map(l => l.id));
      return [...prev.filter(l => !ids.has(l.id)), ...doPedido].sort((a, b) => new Date(b.data) - new Date(a.data));
    });
  }

  useEffect(() => { recarregarSeparacao(); }, []);

  // Pedido aberto: guarda o id e carrega o histórico completo dele
  useEffect(() => {
    pedidoAbertoRef.current = pedidoSeparAtivo ? pedidoSeparAtivo.id : null;
    if (pedidoSeparAtivo) carregarHistoricoPedido(pedidoSeparAtivo.id);
  }, [pedidoSeparAtivo && pedidoSeparAtivo.id]);

  // ==== CONTAGEM DE ESTOQUE (por porta-palete) ====
  // Cada pessoa conta uma porta-palete: bipa a etiqueta, bipa os produtos e finaliza.
  // A contagem é aplicada no banco (aplicar_contagem_pp), com trava e histórico de quem contou.
  const chaveRascunhoCont = "contagemRascunho:" + (usuarioLogado.email || "");
  const rascunhoCont = (() => { try { return JSON.parse(localStorage.getItem(chaveRascunhoCont) || "null"); } catch (e) { return null; } })();
  const [contPP, setContPP] = useState(rascunhoCont ? rascunhoCont.pp : null);  // { id, codigo, label, ultimaContagemId, iniciadaEm }
  const [contItens, setContItens] = useState(rascunhoCont ? rascunhoCont.itens : {}); // { [produtoId]: qtd contada }
  const [contOrdem, setContOrdem] = useState(rascunhoCont ? rascunhoCont.ordem : []); // último bipado primeiro
  const [contScan, setContScan] = useState("");
  const [contModo, setContModo] = useState("bip"); // 'bip' | 'digitar'
  const [contMsg, setContMsg] = useState(rascunhoCont && rascunhoCont.pp ? { tipo: "info", texto: `Contagem de ${rascunhoCont.pp.codigo} recuperada — continue de onde parou.` } : null);
  const [contZerar, setContZerar] = useState(true);
  const [contConfirmar, setContConfirmar] = useState(false);
  const [contAplicando, setContAplicando] = useState(false);
  const [contagens, setContagens] = useState([]);
  const [contagemAberta, setContagemAberta] = useState(null); // { contagem, itens }
  const contScanRef = useRef(null);
  const indiceBuscaProdutos = useMemo(() => montarIndiceBusca(produtos), [produtos]);
  // código bipado que não existe: buscar o produto e ligar o código a ele
  const [contLigar, setContLigar] = useState(null);   // { codigo, termo, escolhido, salvando }
  // trocar um produto cadastrado à mão pelo cadastro certo (ex.: do Tiny)
  const [contTrocar, setContTrocar] = useState(null); // { origem, termo, escolhido, salvando }
  const [contSaidos, setContSaidos] = useState({});   // produtos tirados desta porta-palete (esconde até recarregar)
  const resultadosTrocar = contTrocar && normBusca(contTrocar.termo).length >= 2
    ? buscarProdutos(indiceBuscaProdutos, contTrocar.termo, null, 30).filter(r => r.p.id !== contTrocar.origem.id).slice(0, 25) : [];
  async function tirarDaPortaPalete(l) {
    if (!contPP) return;
    const prod = l.prod;
    const txtQtd = l.sistema > 0 ? `\n\nO sistema diz que tem ${l.sistema} un. aqui. Elas serão baixadas do estoque.` : "";
    if (!confirm(`Tirar "${prod.nome}" da porta-palete ${contPP.codigo}?\n(Ele aparece aqui no sistema, mas não está na porta-palete.)${txtQtd}`)) return;
    const { data, error } = await supabaseClient.rpc("tirar_da_porta_palete", { p_produto: prod.id, p_pp: contPP.id, p_usuario: usuarioLogado.email });
    if (error) { tocarSom("erro"); setContMsg({ tipo: "erro", texto: "Não consegui tirar: " + error.message }); return; }
    setContItens(prev => { if (prev[prod.id] === undefined) return prev; const n = { ...prev }; delete n[prod.id]; return n; });
    setContOrdem(prev => prev.filter(id => id !== prod.id));
    setContSaidos(prev => ({ ...prev, [contPP.id + ":" + prod.id]: true }));
    tocarSom("ok");
    setContMsg({ tipo: "ok", texto: `✓ "${prod.nome}" tirado da ${contPP.codigo}${data && data.baixado ? ` (${data.baixado} un. baixadas)` : ""}.` });
    recarregarTudo();
  }
  function abrirTrocarProduto(prod) {
    const termo = String(prod.nome || "").split(/\s+/).filter(w => w.length > 1).slice(0, 3).join(" ");
    setContLigar(null);
    setContTrocar({ origem: prod, termo, escolhido: null, salvando: false });
  }
  async function confirmarTrocarProduto() {
    if (!contTrocar || !contTrocar.escolhido || contTrocar.salvando) return;
    const o = contTrocar.origem, d = contTrocar.escolhido;
    const avisoCodigo = o.codigoBarras && d.codigoBarras && String(o.codigoBarras).trim() !== String(d.codigoBarras).trim()
      ? `\n\nAtenção: os dois têm código de barras diferente. Fica o do novo (${d.codigoBarras}); o ${o.codigoBarras} deixa de funcionar.` : "";
    if (!confirm(`Substituir\n"${o.nome}" (SKU ${o.sku || "—"})\npor\n"${d.nome}" (SKU ${d.sku || "—"})?\n\nA quantidade, as porta-paletes e o histórico passam para o novo, e o cadastro antigo é apagado.${avisoCodigo}`)) return;
    setContTrocar(c => ({ ...c, salvando: true }));
    const { data, error } = await supabaseClient.rpc("substituir_produto", { p_origem: o.id, p_destino: d.id, p_usuario: usuarioLogado.email });
    if (error) {
      tocarSom("erro");
      setContTrocar(c => ({ ...c, salvando: false }));
      setContMsg({ tipo: "erro", texto: "Não consegui substituir: " + error.message });
      return;
    }
    // a contagem em andamento passa a usar o produto novo
    setContItens(prev => {
      if (prev[o.id] === undefined) return prev;
      const n = { ...prev }; const v = n[o.id]; delete n[o.id];
      n[d.id] = n[d.id] === undefined || n[d.id] === "" ? v : (Number(n[d.id]) || 0) + (Number(v) || 0);
      return n;
    });
    setContOrdem(prev => [...new Set(prev.map(id => id === o.id ? d.id : id))]);
    setProdutos(prev => prev.filter(p => p.id !== o.id).map(p => p.id === d.id
      ? { ...p, qtd: (Number(p.qtd) || 0) + (Number(o.qtd) || 0), codigoBarras: p.codigoBarras || o.codigoBarras } : p));
    setContTrocar(null);
    tocarSom("ok");
    setContMsg({ tipo: "ok", texto: `✓ "${o.nome}" substituído por "${d.nome}" (SKU ${d.sku || "—"}).` });
    recarregarTudo();
  }
  const resultadosLigar = contLigar && normBusca(contLigar.termo).length >= 2
    ? buscarProdutos(indiceBuscaProdutos, contLigar.termo, null, 25)
        .sort((a, b) => (a.p.codigoBarras ? 1 : 0) - (b.p.codigoBarras ? 1 : 0) || b.nota - a.nota) : [];
  async function ligarCodigoAoProduto() {
    if (!contLigar || !contLigar.escolhido || contLigar.salvando) return;
    const prod = contLigar.escolhido, codigo = contLigar.codigo;
    if (prod.codigoBarras && String(prod.codigoBarras).trim() !== codigo &&
        !confirm(`"${prod.nome}" já tem o código ${prod.codigoBarras}. Trocar por ${codigo}?`)) return;
    setContLigar(c => ({ ...c, salvando: true }));
    const { error } = await supabaseClient.from("estoque").update({ codigo_barras: codigo }).eq("id", prod.id);
    if (error) {
      tocarSom("erro");
      setContLigar(c => ({ ...c, salvando: false }));
      setContMsg({ tipo: "erro", texto: "Não consegui ligar o código: " + error.message });
      return;
    }
    const atualizado = { ...prod, codigoBarras: codigo };
    setProdutos(prev => prev.map(p => p.id === prod.id ? { ...p, codigoBarras: codigo } : p));
    setContLigar(null);
    adicionarNaContagemProduto(atualizado);
    setContMsg({ tipo: "ok", texto: `✓ Código ${codigo} ligado a "${prod.nome}" e +1 contado. Da próxima vez é só bipar.` });
  }

  // rascunho salvo no aparelho: se a bateria acabar ou a página fechar, a contagem não se perde
  useEffect(() => {
    try {
      if (contPP) localStorage.setItem(chaveRascunhoCont, JSON.stringify({ pp: contPP, itens: contItens, ordem: contOrdem }));
      else localStorage.removeItem(chaveRascunhoCont);
    } catch (e) {}
  }, [contPP, contItens, contOrdem]);

  useEffect(() => {
    if (tela === "contagem" && contScanRef.current && !contConfirmar && !contLigar && !contTrocar) contScanRef.current.focus();
  }, [tela, contPP, contMsg, contConfirmar, !!contLigar, !!contTrocar]);

  async function recarregarContagens() {
    const { data, error } = await supabaseClient.from("contagens").select("*").order("id", { ascending: false }).limit(50);
    if (!error) setContagens(data || []);
  }
  useEffect(() => { recarregarContagens(); }, []);

  async function abrirContagemHistorico(c) {
    const { data, error } = await supabaseClient.from("contagem_itens").select("*").eq("contagem_id", c.id).order("id");
    if (error) { alert("Erro ao abrir contagem: " + error.message); return; }
    setContagemAberta({ contagem: c, itens: data || [] });
  }

  async function iniciarContagem(pp) {
    // guarda qual era a última contagem desta porta-palete: se outra pessoa aplicar uma
    // contagem nela enquanto você conta, o sistema avisa em vez de sobrescrever.
    const { data, error } = await supabaseClient.from("contagens").select("id")
      .eq("porta_palete_id", pp.id).eq("origem", "Contagem").order("id", { ascending: false }).limit(1);
    if (error) { setContMsg({ tipo: "erro", texto: "Erro ao iniciar contagem: " + error.message }); return; }
    setContPP({ id: pp.id, codigo: pp.codigo, label: portaPaleteLabel(pp), ultimaContagemId: data && data[0] ? data[0].id : 0, iniciadaEm: new Date().toISOString() });
    setContItens({}); setContOrdem([]); setContConfirmar(false);
    tocarSom("ok");
    setContMsg({ tipo: "info", texto: `Contando ${pp.codigo} (${portaPaleteLabel(pp)}). Agora bipe cada produto desta porta-palete.` });
  }

  function cancelarContagem() {
    if (contPP && Object.keys(contItens).length > 0 && !confirm(`Descartar a contagem de ${contPP.codigo}? Nada foi aplicado ainda.`)) return;
    setContPP(null); setContItens({}); setContOrdem([]); setContConfirmar(false); setContMsg(null);
  }

  function somarNaContagem(prod, qtd) {
    setContItens(prev => ({ ...prev, [prod.id]: (Number(prev[prod.id]) || 0) + qtd }));
    setContOrdem(prev => [prod.id, ...prev.filter(x => x !== prod.id)]);
  }
  function definirNaContagem(prodId, valor) {
    setContItens(prev => ({ ...prev, [prodId]: valor === "" ? "" : Math.max(0, parseInt(valor) || 0) }));
    setContOrdem(prev => prev.includes(prodId) ? prev : [prodId, ...prev]);
  }
  function tirarDaContagem(prodId) {
    setContItens(prev => { const n = { ...prev }; delete n[prodId]; return n; });
    setContOrdem(prev => prev.filter(x => x !== prodId));
  }

  const contEsperados = contPP ? produtosDaPortaPalete(portaPaleteById(contPP.id)) : [];
  const idsEsperadosCont = new Set(contEsperados.map(p => p.id));
  const sugestoesCont = (contPP && normBusca(contScan).length >= 2 && !portaPaleteByCodigo(contScan.trim()))
    ? buscarProdutos(indiceBuscaProdutos, contScan, idsEsperadosCont, 8) : [];
  const contLinhas = (() => {
    if (!contPP) return [];
    const esperadoPorId = new Map(contEsperados.map(p => [p.id, p]));
    const ids = [...contOrdem.filter(id => contItens[id] !== undefined), ...contEsperados.map(p => p.id).filter(id => contItens[id] === undefined)];
    return [...new Set(ids)].filter(id => !contSaidos[contPP.id + ":" + id] || contItens[id] !== undefined).map(id => {
      const prod = produtos.find(p => p.id === id) || esperadoPorId.get(id);
      if (!prod) return null;
      const sistema = esperadoPorId.has(id) ? esperadoPorId.get(id).qtdPP : 0;
      const contadoBruto = contItens[id];
      const contado = contadoBruto === undefined || contadoBruto === "" ? null : Number(contadoBruto);
      const dif = contado !== null ? contado - sistema : (contZerar ? -sistema : null);
      return { prod, sistema, contado, dif, esperado: esperadoPorId.has(id) };
    }).filter(Boolean);
  })();

  function adicionarNaContagemProduto(prod) {
    let qtd = 1;
    if (contModo === "digitar") {
      const n = parseInt(window.prompt(`Quantidade de "${prod.nome}" (soma ao que já foi contado):`));
      if (!(n > 0)) return;
      qtd = n;
    }
    setContScan("");
    somarNaContagem(prod, qtd);
    const esperado = contEsperados.some(p => p.id === prod.id);
    tocarSom("ok");
    setContMsg({ tipo: esperado ? "ok" : "info", texto: `+${qtd} ${prod.nome} — contado: ${(Number(contItens[prod.id]) || 0) + qtd}${esperado ? "" : " · este produto não estava cadastrado nesta porta-palete (será incluído nela)"}` });
    if (contScanRef.current) contScanRef.current.focus();
  }

  function handleScanContagem(raw) {
    const val = (raw || "").trim();
    if (!val) { setContScan(""); return; }
    const pp = portaPaleteByCodigo(val);
    if (pp) {
      setContScan("");
      if (contPP && contPP.id === pp.id) { setContMsg({ tipo: "info", texto: `Você já está contando ${pp.codigo}.` }); return; }
      if (contPP && Object.keys(contItens).length > 0 && !confirm(`Você está no meio da contagem de ${contPP.codigo}. Descartar e começar ${pp.codigo}?`)) return;
      iniciarContagem(pp);
      return;
    }
    if (!contPP) {
      setContScan("");
      tocarSom("erro");
      setContMsg({ tipo: "erro", texto: `Bipe primeiro a etiqueta da porta-palete. "${val}" não é uma porta-palete cadastrada.` });
      return;
    }
    const res = buscarProdutos(indiceBuscaProdutos, val, idsEsperadosCont, 8);
    const exatos = res.filter(r => r.exato);
    let prod = null;
    if (exatos.length === 1) prod = exatos[0].p;
    else if (exatos.length > 1) {
      tocarSom("erro");
      setContMsg({ tipo: "info", texto: `O código "${val}" está em ${exatos.length} produtos. Toque no produto certo na lista abaixo.` });
      setContScan(val);
      return;
    } else if (res.length === 1 && normBusca(val).length >= 3) prod = res[0].p;
    else if (res.length > 1) {
      setContMsg({ tipo: "info", texto: `Encontrei ${res.length}${res.length === 8 ? "+" : ""} produtos para "${val}". Toque no certo na lista abaixo.` });
      setContScan(val);
      return;
    }
    if (!prod) {
      setContScan("");
      tocarSom("erro");
      const pareceCodigo = /^\d{8,14}$/.test(val.replace(/\s/g, ""));
      if (pareceCodigo) {
        setContLigar({ codigo: val.replace(/\s/g, ""), termo: "", escolhido: null, salvando: false });
        setContMsg(null);
        return;
      }
      setContMsg({ tipo: "erro", texto: `"${val}" não encontrado. Tente pelo nome (ex.: "torneira preta") ou pelo código do fornecedor.` });
      return;
    }
    adicionarNaContagemProduto(prod);
  }

  async function aplicarContagem() {
    if (!contPP || contAplicando) return;
    setContAplicando(true);
    try {
      const itens = Object.entries(contItens)
        .filter(([, q]) => q !== "" && q !== undefined && q !== null)
        .map(([pid, q]) => ({ produto_id: /^\d+$/.test(pid) ? Number(pid) : pid, qtd: Number(q) || 0 }));  // id pode ser número ou UUID
      const { data, error } = await supabaseClient.rpc("aplicar_contagem_pp", {
        p_pp_id: contPP.id, p_itens: itens, p_usuario: usuarioLogado.email,
        p_ultima_contagem_id: contPP.ultimaContagemId, p_iniciada_em: contPP.iniciadaEm,
        p_zerar_nao_contados: contZerar,
      });
      if (error) {
        tocarSom("erro");
        setContConfirmar(false);
        setContMsg({ tipo: "erro", texto: "Contagem NÃO aplicada: " + error.message });
        return;
      }
      tocarSom("completo");
      const dt = Number(data.diferenca_total) || 0;
      setContMsg({ tipo: "ok", texto: `✓ Contagem de ${contPP.codigo} aplicada: ${data.itens} produto(s), ${data.itens_alterados} com diferença (${dt > 0 ? "+" : ""}${dt} un. no total).` });
      setContPP(null); setContItens({}); setContOrdem([]); setContConfirmar(false);
      await Promise.all([recarregarTudo(), recarregarContagens()]);
    } finally {
      setContAplicando(false);
    }

  // ==== TEMPO REAL ====
  // Quando qualquer pessoa bipa, baixa, move ou conta, as telas de todos os aparelhos se
  // atualizam sozinhas (Supabase Realtime). Bipadas atualizam só a linha que mudou.
  const recarregarRef = useRef({});
  recarregarRef.current = { recarregarTudo, recarregarPortaPaletes, recarregarSeparacao, recarregarContagens };
  useEffect(() => {
    const timers = {};
    // junta várias mudanças seguidas numa recarga só (no máximo 1 a cada ~1 s por grupo)
    const agendar = (grupo, ms = 900) => {
      if (timers[grupo]) return;
      timers[grupo] = setTimeout(() => {
        delete timers[grupo];
        const r = recarregarRef.current;
        if (grupo === "estoque") { r.recarregarTudo(); r.recarregarPortaPaletes(); }
        else if (grupo === "separacao") r.recarregarSeparacao();
        else if (grupo === "contagens") r.recarregarContagens();
      }, ms);
    };
    const grupoDaTabela = {
      estoque: "estoque", estoque_pp: "estoque", porta_paletes: "estoque",
      entradas: "estoque", saidas: "estoque", notas_fiscais: "estoque",
      pedidos_separacao: "separacao", itens_pedidos_separacao: "separacao",
      itens_separacao_alocacao: "separacao", logs_separacao: "separacao", contagens: "contagens",
    };
    let canal = null;
    if (supabaseClient.channel) {
      canal = supabaseClient.channel("stockctrl-modulo");
      Object.keys(grupoDaTabela).forEach(tabela => {
        canal.on("postgres_changes", { event: "*", schema: "public", table: tabela }, (payload) => {
          const novo = payload && payload.new;
          if (tabela === "itens_pedidos_separacao" && payload.eventType === "UPDATE" && novo && novo.id) {
            const it = rowToItemSeparacao(novo);
            setItensSeparacaoPorPedido(prev => ({
              ...prev,
              [it.pedidoId]: (prev[it.pedidoId] || []).map(x => x.id === it.id ? { ...x, quantidadeBipada: it.quantidadeBipada } : x),
            }));
            return;
          }
          if (tabela === "itens_separacao_alocacao" && novo && novo.item_id) {
            setPpAlocSepar(prev => ({ ...prev, [novo.item_id]: { ...(prev[novo.item_id] || {}), [novo.porta_palete_id ?? "auto"]: Number(novo.qtd) || 0 } }));
            return;
          }
          if (tabela === "logs_separacao" && payload.eventType === "INSERT" && novo && novo.id) {
            const l = rowToLogSeparacao(novo);
            setLogsSeparacao(prev => prev.some(x => x.id === l.id) ? prev : [l, ...prev]);
            return;
          }
          agendar(grupoDaTabela[tabela]);
        });
      });
      canal.subscribe();
    }
    // aparelho que ficou com a tela apagada ou sem internet: ao voltar, recarrega tudo
    const aoVoltar = () => {
      if (document.visibilityState === "visible") { agendar("estoque", 50); agendar("separacao", 50); agendar("contagens", 50); }
    };
    document.addEventListener("visibilitychange", aoVoltar);
    window.addEventListener("online", aoVoltar);
    return () => {
      if (canal && supabaseClient.removeChannel) supabaseClient.removeChannel(canal);
      document.removeEventListener("visibilitychange", aoVoltar);
      window.removeEventListener("online", aoVoltar);
      Object.values(timers).forEach(clearTimeout);
    };
  }, []);


  // ==== AO VIVO: quem está contando / separando agora ====
  // Cada aparelho avisa os outros (Supabase Realtime Presence) o que está fazendo. Não grava nada
  // no banco: quando a pessoa fecha a tela ou perde a conexão, some sozinho do mapa.
  const [presencas, setPresencas] = useState([]);
  const presencaCanalRef = useRef(null);
  const presencaDadosRef = useRef(null);
  presencaDadosRef.current = contPP
    ? { tipo: "contagem", usuario: usuarioLogado.email, ppId: contPP.id, ppCodigo: contPP.codigo,
        itens: Object.values(contItens || {}).filter(q => Number(q) > 0).length,
        pecas: Object.values(contItens || {}).reduce((s, q) => s + (Number(q) || 0), 0), desde: contPP.iniciadaEm || null }
    : (tela === "separacao" && pedidoSeparAtivo)
      ? { tipo: "separacao", usuario: usuarioLogado.email, pedidoId: pedidoSeparAtivo.id, numeroPedido: pedidoSeparAtivo.numeroPedido, desde: pedidoSeparAtivo.separacaoIniciadaAt || null }
      : (tela === "separacaoPP" && (itensSeparPP.length > 0 || (scanPortaPaletePP && !sepPPConcluida)))
        ? { tipo: "separacaoPP", usuario: usuarioLogado.email, itens: itensSeparPP.length,
            ppId: scanPortaPaletePP ? scanPortaPaletePP.id : ((itensSeparPP.filter(i => i.ppId).slice(-1)[0] || {}).ppId || null) }
        : { tipo: null, usuario: usuarioLogado.email };
  const assinaturaPresenca = JSON.stringify(presencaDadosRef.current);
  // Limite do Supabase: ~5 atualizações de presença a cada 30 s por aparelho. Usamos no máximo 4 por 30 s
  // (com pelo menos 1,5 s entre elas): as primeiras saem na hora e, durante bipes seguidos, o último estado
  // é enviado assim que liberar.
  const presencaEnviosRef = useRef([]);
  const presencaTimerRef = useRef(null);
  const PRESENCA_JANELA = 31000, PRESENCA_MAX = 4, PRESENCA_GAP = 1500;
  function enviarPresencaAgora() {
    const c = presencaCanalRef.current;
    if (!c || !c.track) return;
    presencaEnviosRef.current.push(Date.now());
    try { const r = c.track({ ...presencaDadosRef.current, t: Date.now() }); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  }
  function enviarPresenca() {
    if (presencaTimerRef.current) return; // já tem envio agendado: ele leva os dados mais novos
    const agora = Date.now();
    const envios = presencaEnviosRef.current = presencaEnviosRef.current.filter(t => agora - t < PRESENCA_JANELA);
    let espera = 0;
    if (envios.length >= PRESENCA_MAX) espera = envios[envios.length - PRESENCA_MAX] + PRESENCA_JANELA - agora;
    if (envios.length) espera = Math.max(espera, envios[envios.length - 1] + PRESENCA_GAP - agora);
    if (espera <= 0) { enviarPresencaAgora(); return; }
    presencaTimerRef.current = setTimeout(() => { presencaTimerRef.current = null; enviarPresencaAgora(); }, espera + 50);
  }
  useEffect(() => {
    if (!supabaseClient.channel) return;
    let ativo = true, canal = null, tentativas = 0, timerReconectar = null;
    const conectar = () => {
      if (!ativo) return;
      if (canal) { const velho = canal; canal = null; presencaCanalRef.current = null; try { supabaseClient.removeChannel && supabaseClient.removeChannel(velho); } catch (e) {} }
      const chave = (usuarioLogado.email || "anon") + ":" + Math.random().toString(36).slice(2, 8);
      const c = supabaseClient.channel("stockctrl-presenca", { config: { presence: { key: chave } } });
      canal = c;
      c.on("presence", { event: "sync" }, () => {
        const estado = c.presenceState ? c.presenceState() : {};
        const lista = [];
        Object.values(estado).forEach(arr => (arr || []).forEach(p => { if (p && p.tipo) lista.push(p); }));
        setPresencas(lista);
      });
      c.subscribe((status) => {
        if (!ativo || canal !== c) return;
        if (status === "SUBSCRIBED") {
          tentativas = 0;
          presencaCanalRef.current = c;
          enviarPresenca();
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          presencaCanalRef.current = null;
          clearTimeout(timerReconectar);
          const atraso = Math.min(30000, 3000 * Math.pow(2, tentativas++));
          timerReconectar = setTimeout(conectar, atraso);
        }
      });
    };
    conectar();
    // celular voltou da tela bloqueada / outra aba: confere a conexão e reenvia o que está fazendo
    const aoVoltar = () => {
      if (document.visibilityState !== "visible") return;
      if (!presencaCanalRef.current) { clearTimeout(timerReconectar); tentativas = 0; conectar(); }
      else enviarPresenca();
    };
    document.addEventListener("visibilitychange", aoVoltar);
    // reforço leve: a cada 45 s reenvia a presença (se o servidor tiver descartado, ela volta)
    const reforco = setInterval(() => { if (document.visibilityState === "visible") enviarPresenca(); }, 45000);
    return () => {
      ativo = false;
      clearTimeout(timerReconectar); clearInterval(reforco);
      clearTimeout(presencaTimerRef.current); presencaTimerRef.current = null;
      document.removeEventListener("visibilitychange", aoVoltar);
      presencaCanalRef.current = null;
      if (canal) { try { canal.untrack && canal.untrack(); } catch (e) {} if (supabaseClient.removeChannel) supabaseClient.removeChannel(canal); }
    };
  }, []);
  useEffect(() => { enviarPresenca(); }, [assinaturaPresenca]);

  async function processarScanSeparacao(codigoBruto, quantidadeManual) {
    if (!pedidoSeparAtivo || !codigoBruto || !codigoBruto.trim()) return;
    const codigo = codigoBruto.trim();
    const qtdAdicional = Math.max(1, Math.floor(Number(quantidadeManual) || 1));
    const itens = getItensDoPedidoSepar(pedidoSeparAtivo.id);
    const item = itens.find(it =>
      (it.sku && it.sku.toLowerCase() === codigo.toLowerCase()) ||
      (it.codigoBarras && String(it.codigoBarras).toLowerCase() === codigo.toLowerCase()) ||
      String(it.produtoId) === codigo
    );
    if (!item) {
      tocarSom("erro");
      setScanMsgSepar({ tipo: "erro", texto: `Produto "${codigo}" não pertence a este pedido.` });
      return;
    }
    // Conferência rápida com o que está na tela (o banco confere de novo, com os números atuais)
    if (item.quantidadeBipada >= item.quantidade) {
      tocarSom("erro");
      setScanMsgSepar({ tipo: "excesso", texto: `Quantidade excedida para: ${item.descricao}` });
      return;
    }
    if (item.quantidadeBipada + qtdAdicional > item.quantidade) {
      tocarSom("erro");
      setScanMsgSepar({ tipo: "excesso", texto: `Quantidade excedida para: ${item.descricao} — restam apenas ${item.quantidade - item.quantidadeBipada}, você tentou adicionar ${qtdAdicional}.` });
      return;
    }
    const ppEsc = ppEscolhaSepar[item.id];
    const ppEscLabel = ppEsc ? portaPaleteLabel(portaPaleteById(ppEsc)) : "";
    setScanQtdSepar(1);
    // A bipada é SOMADA no banco (bipar_item_separacao): várias pessoas podem bipar o mesmo
    // pedido ao mesmo tempo sem uma apagar a contagem da outra.
    const { data, error } = await supabaseClient.rpc("bipar_item_separacao", {
      p_item_id: item.id, p_qtd: qtdAdicional, p_pp_id: ppEsc ? Number(ppEsc) : null, p_usuario: usuarioLogado.email,
    });
    if (error) {
      tocarSom("erro");
      setScanMsgSepar({ tipo: /Quantidade excedida/i.test(error.message) ? "excesso" : "erro", texto: error.message });
      recarregarSeparacao();
      return;
    }
    const novaQtd = Number(data.quantidade_bipada);
    setItensSeparacaoPorPedido(prev => ({
      ...prev,
      [item.pedidoId]: (prev[item.pedidoId] || []).map(it => it.id === item.id ? { ...it, quantidadeBipada: Math.max(it.quantidadeBipada, novaQtd) } : it),
    }));
    // atualiza "Bipado: ..." deste item com o que está no banco
    supabaseClient.from("itens_separacao_alocacao").select("*").eq("item_id", item.id).then(({ data: linhas }) => {
      if (!linhas) return;
      const m = alocacoesParaMapa(linhas);
      setPpAlocSepar(prev => ({ ...prev, [item.id]: m[item.id] || {} }));
    });
    const completo = novaQtd >= item.quantidade;
    tocarSom(completo ? "completo" : "ok");
    setScanMsgSepar({ tipo: "ok", texto: `✓ ${item.descricao} +${qtdAdicional}${completo ? " — COMPLETO!" : ` (${novaQtd}/${item.quantidade})`}${ppEscLabel ? ` · de ${ppEscLabel}` : ""}` });
  }

  async function finalizarSeparacaoPedido() {
    if (!pedidoSeparAtivo || finalizandoSepar) return;
    setFinalizandoSepar(true);
    try {
      const itensFin = getItensDoPedidoSepar(pedidoSeparAtivo.id);
      // Tudo é feito no banco, numa única operação com trava (finalizar_separacao): baixa de
      // cada porta-palete de onde foi bipado, baixa do total, saídas e status do pedido.
      // Se faltar estoque, nada é gravado.
      const { error } = await supabaseClient.rpc("finalizar_separacao", {
        p_pedido_id: pedidoSeparAtivo.id, p_usuario: usuarioLogado.email,
      });
      if (error) {
        alert("⛔ Operação cancelada — nenhuma baixa foi aplicada:\n\n" + error.message);
        await Promise.all([recarregarSeparacao(), recarregarTudo()]);
        return;
      }
      // limpa as escolhas "Retirar de" deste pedido (salvas neste aparelho)
      setPpEscolhaSepar(prev => {
        const n = { ...prev };
        itensFin.forEach(it => { delete n[it.id]; });
        try { localStorage.setItem("ppEscolhaSepar", JSON.stringify(n)); } catch (e) {}
        return n;
      });
      await Promise.all([recarregarSeparacao(), recarregarTudo()]);
      alert(`✅ Pedido ${pedidoSeparAtivo.numeroPedido} finalizado! Estoque atualizado com sucesso.`);
      setTelaSepar("lista");
      setPedidoSeparAtivo(null);
    } catch (e) {
      alert("Erro ao finalizar separação: " + e.message);
    } finally {
      setFinalizandoSepar(false);
    }
  }

    const janela = window.open("", "_blank");
    janela.document.write(`<pre style="font-family:monospace;padding:24px;font-size:13px;white-space:pre-wrap;">ROMANEIO DE SEPARAÇÃO
Pedido: ${pedido.numeroPedido}
Envio: ${pedido.numeroEnvio}
Loja: ${pedido.loja}
${pedido.observacoes ? "Obs: " + pedido.observacoes : ""}
${"=".repeat(64)}
${linhas}
${"=".repeat(64)}
Total: ${itens.length} item(ns) / ${totalPecas} peça(s)
Gerado em: ${new Date().toLocaleString("pt-BR")}
</pre>`);
    janela.document.close();

              empresaId: f.get("empresaId"),
              fornecedorId: f.get("fornecedorId"),
              numero: f.get("numero"),

                <Field label="Código de barras (opcional)">
                  <div style={{ display: "flex", gap: 6 }}>
                    <input value={produtoCodBarras} onChange={e => setProdutoCodBarras(e.target.value)} placeholder="Bipar ou digitar o código" style={{ ...inputStyle, fontFamily: "monospace" }} />
                    <button type="button" title="Bipar código de barras" onClick={() => setScannerAlvo("produto")} style={iconBtn}>
                      <Icon name="camera" size={16} />
                    </button>
                  </div>
                </Field>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}>
                    <Field label="Fornecedor">
                      <div style={{ display: "flex", gap: 6 }}>
                        <select value={entradaFornecedorSel} onChange={e => setEntradaFornecedorSel(e.target.value)} style={{ flex: 1, minWidth: 0 }}>
                          <option value="">Selecione</option>
                          {fornecedores.map(f => <option key={f.id} value={f.id}>{f.nomeFantasia}</option>)}
                        </select>
                        <button type="button" title="Novo fornecedor" onClick={() => abrirQuickAdd("fornecedor", id => setEntradaFornecedorSel(String(id)))} style={{ ...iconBtn, width: 34 }}>
                          <Icon name="plus" size={15} />
                        </button>
                      </div>
                    </Field>
                  </div>
                  <div style={col}>
                    <Field label="Empresa">
                      <div style={{ display: "flex", gap: 6 }}>
                        <select value={entradaEmpresaSel} onChange={e => setEntradaEmpresaSel(e.target.value)} style={{ flex: 1, minWidth: 0 }}>
                          <option value="">Selecione</option>
                          {empresas.map(e => <option key={e.id} value={e.id}>{e.nomeFantasia}</option>)}
                        </select>
                        <button type="button" title="Nova empresa" onClick={() => abrirQuickAdd("empresa", id => setEntradaEmpresaSel(String(id)))} style={{ ...iconBtn, width: 34 }}>
                          <Icon name="plus" size={15} />
                        </button>
                      </div>
                    </Field>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}><Field label="Categoria (opcional)"><input name="categoria" style={inputStyle} /></Field></div>
                  <div style={col}><Field label="Código do fornecedor (opcional)"><input name="marca" style={{ ...inputStyle, fontFamily: "monospace" }} /></Field></div>
                </div>
                <div style={{ fontSize: 12.5, fontWeight: 700, color: "#D2A256", margin: "6px 0 8px" }}>Localização física</div>
                <Field label="Porta-palete">{campoPP}</Field>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}><Field label="Fileira"><input type="number" min="1" value={entradaFileira} onChange={e => { setEntradaFileira(e.target.value); setEntradaPPSel(""); }} style={inputStyle} /></Field></div>
                  <div style={col}><Field label="Porta"><input value={entradaPorta} onChange={e => { setEntradaPorta(e.target.value); setEntradaPPSel(""); }} style={inputStyle} placeholder="A" /></Field></div>
                  <div style={col}><Field label="Nível"><input type="number" min="1" max="3" value={entradaNivel} onChange={e => { setEntradaNivel(e.target.value); setEntradaPPSel(""); }} style={inputStyle} /></Field></div>
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={col}><Field label="Estoque mínimo"><input name="min" type="number" min="0" defaultValue="0" style={inputStyle} /></Field></div>
                  <div style={col}><Field label="Estoque máximo"><input name="max" type="number" min="0" defaultValue="0" style={inputStyle} /></Field></div>
                </div>
              </>
            )}

            <div style={{ borderTop: "1px solid #2A3445", margin: "6px 0 14px" }} />
            <Field label="Quantidade que está entrando"><input name="quantidade" type="number" min="1" required style={inputStyle} /></Field>
            <div style={{ display: "flex", gap: 10 }}>
              <div style={col}><Field label="Número da NF (opcional)"><input name="numeroNf" style={inputStyle} /></Field></div>
              <div style={col}><Field label="Observações"><input name="obs" style={inputStyle} /></Field></div>
            </div>

            {entradaErro && (
              <div style={{ background: "#3A1818", border: "1px solid #5C2424", color: "#E07A7A", borderRadius: 8, padding: "9px 12px", fontSize: 13, marginBottom: 6 }}>{entradaErro}</div>
            )}
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <Btn type="submit" variant="primary" style={salvandoEntrada ? { opacity: 0.6, pointerEvents: "none" } : undefined}>
                {salvandoEntrada ? "Salvando..." : entradaModo === "novo" ? "Cadastrar produto e confirmar entrada" : "Confirmar entrada"}
              </Btn>
              <Btn onClick={() => setModalEntrada(false)}>Cancelar</Btn>
            </div>
          </form>
        </Modal>
        );
      })()}

      {/* MODAL: Saída */}
      {modalSaida && (
        <Modal title="Registrar saída de produto" onClose={() => setModalSaida(false)}>
          <form onSubmit={e => {
            e.preventDefault();
            const f = new FormData(e.target);
            registrarSaida({
              produtoId: f.get("produtoId"),
              quantidade: f.get("quantidade"),
              destino: f.get("destino"),
              motivo: f.get("motivo"),
              ppId: f.get("ppId"),
            });
          }}>
            <Field label="Produto">
              <div style={{ display: "flex", gap: 6 }}>
                <div style={{ flex: 1 }}>
                  <ProdutoBuscaSelect produtos={produtos} value={saidaProdutoId} onChange={v => { setSaidaProdutoId(v); setSaidaPPSel(""); }}
                    getExtra={p => `${p.qtd} em estoque`} />
                </div>
                <input type="hidden" name="produtoId" value={saidaProdutoId} />
                <button type="button" title="Bipar código de barras" onClick={() => setScannerAlvo("saida")}
                  style={{ background: "#1B2433", border: "1px solid #2A3445", borderRadius: 8, color: "#D2A256", cursor: "pointer", width: 40, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <Icon name="camera" size={16} />
                </button>
              </div>
            </Field>
            {(() => {
              const prodSel = produtos.find(p => String(p.id) === String(saidaProdutoId));
              const dist = prodSel ? distribuicaoDoProduto(prodSel).filter(r => r.ppId) : [];
              if (dist.length === 0) return null;
              const valor = dist.some(r => String(r.ppId) === saidaPPSel) ? saidaPPSel : "";
              return (
                <Field label="Retirar de qual porta-palete?">
                  <select name="ppId" value={valor} onChange={e => setSaidaPPSel(e.target.value)} style={inputStyle}>
                    <option value="">Automático</option>
                    {dist.map(r => <option key={r.ppId} value={r.ppId}>{portaPaleteLabel(portaPaleteById(r.ppId))} — {r.qtd} un</option>)}
                  </select>
                </Field>
              );
            })()}
            <Field label="Quantidade"><input name="quantidade" type="number" min="1" required style={inputStyle} /></Field>
            <Field label="Destino / cliente"><input name="destino" style={inputStyle} /></Field>
            <Field label="Motivo"><input name="motivo" style={inputStyle} placeholder="Venda, transferência, perda..." /></Field>
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <Btn type="submit" variant="primary">Confirmar saída</Btn>
              <Btn onClick={() => setModalSaida(false)}>Cancelar</Btn>
            </div>
          </form>
        </Modal>
      )}

      {/* MODAL: Porta-palete (cadastro/edição) */}
      {modalPortaPalete && (
        <Modal title={modalPortaPalete.id ? "Editar porta-palete" : "Nova porta-palete"} onClose={() => setModalPortaPalete(null)}>
          <form onSubmit={e => {
            e.preventDefault();
            const f = new FormData(e.target);
            salvarPortaPalete({
              id: modalPortaPalete.id,
              codigo: f.get("codigo"),
              fileira: Number(f.get("fileira")),
              porta: f.get("porta"),
              nivel: Number(f.get("nivel")),
              descricao: f.get("descricao"),
            });
          }}>
            <Field label="Código de barras">
              <div style={{ display: "flex", gap: 8 }}>
                <input ref={codigoPortaPaleteRef} name="codigo" defaultValue={modalPortaPalete.codigo} required style={inputStyle} placeholder="Ex: PP-0001" />
                <button type="button" title="Bipar código de barras" onClick={() => setScannerAlvo("portapalete")}
                  style={{ background: "#1B2433", border: "1px solid #2A3445", borderRadius: 8, color: "#D2A256", cursor: "pointer", width: 40, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <Icon name="camera" size={16} />
                </button>
              </div>
            </Field>
            <div style={{ fontSize: 12, color: "#5C6678", marginTop: -10, marginBottom: 14 }}>
              É esse código que fica etiquetado na porta-palete física. Um leitor USB/Bluetooth digita normalmente nesse campo — o botão da câmera lê sem precisar de leitor físico.
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Field label="Fileira"><input name="fileira" type="number" min="1" defaultValue={modalPortaPalete.fileira} required style={inputStyle} /></Field>
              <Field label="Porta"><input name="porta" defaultValue={modalPortaPalete.porta} required style={inputStyle} placeholder="A" /></Field>
              <Field label="Nível"><input name="nivel" type="number" min="1" max="3" defaultValue={modalPortaPalete.nivel} required style={inputStyle} /></Field>
            </div>
            <Field label="Descrição (opcional)"><input name="descricao" defaultValue={modalPortaPalete.descricao} style={inputStyle} placeholder="Ex: Eletrônicos — SoundX" /></Field>
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <Btn type="submit" variant="primary">{modalPortaPalete.id ? "Salvar e gerenciar produtos" : "Salvar e adicionar produtos"}</Btn>
              <Btn onClick={() => setModalPortaPalete(null)}>Cancelar</Btn>
            </div>
          </form>
        </Modal>
      )}

      {/* MODAL: Ver / cadastrar produtos de uma porta-palete */}
      {modalVerProdutosPP && (() => {
        const pp = modalVerProdutosPP;
        const produtosNaPP = produtosDaPortaPalete(pp);
        const origensTransf = [];
        produtos.forEach(p => distribuicaoDoProduto(p).forEach(r => {
          if (r.ppId !== pp.id && r.qtd > 0) origensTransf.push({ p, ppId: r.ppId, qtd: r.qtd });
        }));
        return (
          <Modal title={`Produtos em ${pp.codigo} · ${portaPaleteLabel(pp)}`} onClose={() => setModalVerProdutosPP(null)} width={560} lateral>
            {produtosNaPP.length === 0 && (
              <div style={{ color: "#5C6678", fontSize: 13.5, padding: "10px 0 18px" }}>Nenhum produto cadastrado nesta porta-palete ainda.</div>
            )}
            {produtosNaPP.length > 0 && (
              <div style={{ border: "1px solid #2A3445", borderRadius: 10, overflow: "hidden", marginBottom: 18 }}>
                <table>
                  <thead><tr><th>Produto</th><th>SKU</th><th>Qtd aqui</th><th></th></tr></thead>
                  <tbody>
                    {produtosNaPP.map(p => (
                      <tr key={p.id}>
                        <td style={{ fontWeight: 600 }}>{p.nome}</td>
                        <td style={{ fontFamily: "monospace", fontSize: 12.5, color: "#8893A6" }}>{p.sku}</td>
                        <td>
                          <button onClick={() => ajustarQtdNaPP(p, pp)} title="Corrigir a quantidade nesta porta-palete" style={{ background: "none", border: "none", borderBottom: "1px dashed #8893A6", color: "inherit", cursor: "pointer", fontWeight: 700, fontSize: "inherit", padding: 0 }}>{p.qtdPP}</button>
                          {p.qtd !== p.qtdPP && <span style={{ color: "#8893A6", fontSize: 11 }}> (total {p.qtd})</span>}
                        </td>
                        <td>
                          <button onClick={() => { setModalVerProdutosPP(null); abrirModalProduto(p); }} style={{ background: "none", border: "none", color: "#8893A6", cursor: "pointer" }}><Icon name="edit" size={14} /></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            <div style={{ fontSize: 12.5, fontWeight: 700, color: "#D2A256", marginBottom: 10 }}>Mover quantidade pra cá</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <select ref={moverProdutoRef} style={{ flex: 1, minWidth: 0 }} disabled={origensTransf.length === 0}>
                {origensTransf.length === 0 && <option>Nenhum produto com estoque em outra porta-palete</option>}
                {origensTransf.map(o => (
                  <option key={`${o.p.id}-${o.ppId || "x"}`} value={`${o.p.id}:${o.ppId || ""}`}>
                    {o.p.nome} ({o.p.sku}) — em {o.ppId ? portaPaleteLabel(portaPaleteById(o.ppId)) : "sem porta-palete"}: {o.qtd} un
                  </option>
                ))}
              </select>
              <input ref={moverQtdRef} type="number" min="1" placeholder="Qtd" disabled={origensTransf.length === 0} style={{ ...inputStyle, width: 90 }} />
              <Btn disabled={origensTransf.length === 0} onClick={() => {
                const sel = moverProdutoRef.current;
                if (!sel || !sel.value) return;
                const [pid, origem] = sel.value.split(":");
                transferirParaPP(pid, origem ? Number(origem) : null, pp.id, moverQtdRef.current ? moverQtdRef.current.value : 0);
                if (moverQtdRef.current) moverQtdRef.current.value = "";
              }}>Mover pra cá</Btn>
            </div>
            <div style={{ fontSize: 12, color: "#5C6678", marginBottom: 16 }}>
              Produto já cadastrado em outra porta-palete? Escolha de onde tirar, digite quantas unidades e mova pra cá. O estoque total não muda.
            </div>

            <Btn variant="primary" icon="plus" style={{ width: "100%", justifyContent: "center" }}
              onClick={() => { setModalVerProdutosPP(null); abrirModalProduto({ fileira: pp.fileira, porta: pp.porta, nivel: pp.nivel }); }}>
              Cadastrar produto novo nesta porta-palete
            </Btn>
          </Modal>
        );
      })()}

      {/* MODAL: Scanner de código de barras */}
      {scannerAlvo && (
        <BarcodeScannerModal onDetected={handleBarcodeDetected} onClose={() => setScannerAlvo(null)} />
      )}

      {/* MODAL: Confirmar contagem */}
      {contConfirmar && contPP && (() => {
        const difs = contLinhas.filter(l => l.dif !== null && l.dif !== 0);
        const naoContados = contLinhas.filter(l => l.contado === null && l.esperado && l.sistema > 0);
        const total = difs.reduce((t, l) => t + l.dif, 0);
        return (
          <Modal title={`Finalizar contagem de ${contPP.codigo}`} onClose={() => setContConfirmar(false)} width={540}>
            <div style={{ fontSize: 13.5, color: "#AEB7C7", marginBottom: 12 }}>
              {contLinhas.filter(l => l.contado !== null).length} produto(s) contado(s) · {difs.length} com diferença · total {total > 0 ? "+" : ""}{total} un.
            </div>
            {naoContados.length > 0 && contZerar && (
              <div style={{ background: "#3A2A14", border: "1px solid #5C4322", color: "#E8B458", borderRadius: 8, padding: "10px 12px", fontSize: 13, marginBottom: 12 }}>
                ⚠ {naoContados.length} produto(s) não foram contados e vão ficar com <b>0</b> nesta porta-palete: {naoContados.map(l => l.prod.nome).join(", ")}
              </div>
            )}
            {difs.length > 0 ? (
              <div style={{ border: "1px solid #2A3445", borderRadius: 10, overflow: "auto", maxHeight: 300, marginBottom: 12 }}>
                <table>
                  <thead><tr><th>Produto</th><th style={{ textAlign: "center" }}>Sistema</th><th style={{ textAlign: "center" }}>Contado</th><th style={{ textAlign: "center" }}>Diferença</th></tr></thead>
                  <tbody>
                    {difs.map(l => (
                      <tr key={l.prod.id}>
                        <td style={{ fontWeight: 600 }}>{l.prod.nome}</td>
                        <td style={{ textAlign: "center" }}>{l.sistema}</td>
                        <td style={{ textAlign: "center" }}>{l.contado === null ? 0 : l.contado}</td>
                        <td style={{ textAlign: "center", fontWeight: 800, color: l.dif > 0 ? "#6FB0E0" : "#E07A7A" }}>{l.dif > 0 ? "+" : ""}{l.dif}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : (
              <div style={{ color: "#5CC98E", fontSize: 13.5, marginBottom: 12 }}>✓ Tudo bate com o sistema.</div>
            )}
            <div style={{ fontSize: 12, color: "#5C6678", marginBottom: 16 }}>Os números do "Sistema" são conferidos de novo no banco na hora de aplicar. O estoque total de cada produto é ajustado pela diferença.</div>
            <div style={{ display: "flex", gap: 10 }}>
              <Btn variant="primary" icon="check-circle" onClick={aplicarContagem} style={{ opacity: contAplicando ? 0.6 : 1 }}>{contAplicando ? "Aplicando..." : "Confirmar e aplicar"}</Btn>
              <Btn onClick={() => setContConfirmar(false)}>Voltar</Btn>
            </div>
          </Modal>
        );
      })()}

      {/* MODAL: Detalhe de uma contagem do histórico */}
      {contagemAberta && (
        <Modal title={`${contagemAberta.contagem.origem} · ${contagemAberta.contagem.porta_palete || ""}`} onClose={() => setContagemAberta(null)} width={560}>
          <div style={{ fontSize: 12.5, color: "#8893A6", marginBottom: 12 }}>
            {new Date(contagemAberta.contagem.created_at).toLocaleString("pt-BR")} · {contagemAberta.contagem.usuario || "—"}
          </div>
          <div style={{ border: "1px solid #2A3445", borderRadius: 10, overflow: "auto", maxHeight: 380 }}>
            <table>
              <thead><tr><th>Produto</th><th>SKU</th><th style={{ textAlign: "center" }}>Sistema</th><th style={{ textAlign: "center" }}>Contado</th><th style={{ textAlign: "center" }}>Diferença</th></tr></thead>
              <tbody>
                {contagemAberta.itens.map(it => (
                  <tr key={it.id}>
                    <td style={{ fontWeight: 600 }}>{it.produto}</td>
                    <td style={{ fontFamily: "monospace", fontSize: 12, color: "#8893A6" }}>{it.sku}</td>
                    <td style={{ textAlign: "center" }}>{it.qtd_sistema}</td>
                    <td style={{ textAlign: "center" }}>{it.qtd_contada}</td>
                    <td style={{ textAlign: "center", fontWeight: 800, color: it.diferenca === 0 ? "#5CC98E" : it.diferenca > 0 ? "#6FB0E0" : "#E07A7A" }}>{it.diferenca > 0 ? "+" : ""}{it.diferenca}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Modal>
      )}

      {/* MODAL: Confirmar exclusão */}
      {confirmDelete && (
        <Modal title="Confirmar exclusão" onClose={() => setConfirmDelete(null)} width={380}>
          <p style={{ color: "#AEB7C7", fontSize: 14, marginBottom: 18 }}>
            Tem certeza que deseja excluir <b style={{ color: "#F3EFE6" }}>{confirmDelete.label}</b>? Essa ação não pode ser desfeita.
          </p>
          <div style={{ display: "flex", gap: 10 }}>
            <Btn variant="danger" onClick={executarExclusao}>Excluir</Btn>
            <Btn onClick={() => setConfirmDelete(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

 function TelaLogin() {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [entrando, setEntrando] = useState(false);

  async function entrar(e) {
    e.preventDefault();
    setErro("");
    setEntrando(true);
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: email.trim().toLowerCase(),
      password: senha,
    });
    setEntrando(false);
    if (error) {
      setErro("E-mail ou senha incorretos.");
    }
  }

  useEffect(() => {
    const wrap = document.getElementById("feed-lines");
    if (!wrap) return;
    const templates = [
      () => `baixa registrada · <b>-${1 + Math.floor(Math.random() * 4)} un</b>`,
      () => `entrada registrada · <b>+${10 + Math.floor(Math.random() * 60)} un</b>`,
      () => `nota fiscal vinculada`,
      () => `estoque abaixo do mínimo`,
      () => `fornecedor atualizado`,
      () => `pedido despachado`,
    ];
    const MAX_LINES = 5;
    function pad(n) { return n.toString().padStart(2, "0"); }
    function nowStamp() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
    function randomSku() { return "SK-" + (2100 + Math.floor(Math.random() * 300)); }
    function pushLine() {
      const sku = randomSku();
      const txt = templates[Math.floor(Math.random() * templates.length)]();
      const line = document.createElement("div");
      line.className = "feed-line";
      line.innerHTML = `<span class="t">${nowStamp()}</span><span class="ev"><b>${sku}</b> — ${txt}</span>`;
      wrap.insertBefore(line, wrap.firstChild);
      while (wrap.children.length > MAX_LINES) { wrap.removeChild(wrap.lastChild); }
    }
    for (let i = 0; i < MAX_LINES; i++) { pushLine(); }
    const interval = setInterval(pushLine, 2400);
    return () => clearInterval(interval);
  }, []);

  return (
    <div id="login-screen-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        #login-screen-root { font-family:'Public Sans', sans-serif; background:#0B1220; color:#EAF0F5; min-height:100vh; }
        #login-screen { display:grid; grid-template-columns: 1.05fr 1fr; min-height:100vh; }
        @media (max-width:900px){ #login-screen{ grid-template-columns:1fr; } .console-panel{ display:none; } }
        .console-panel{ position:relative; overflow:hidden; padding:52px 56px;
          background: linear-gradient(180deg, rgba(11,18,32,0.2), #0B1220 70%),
            repeating-linear-gradient(90deg, rgba(234,240,245,0.025) 0 1px, transparent 1px 84px),
            repeating-linear-gradient(0deg, rgba(234,240,245,0.025) 0 1px, transparent 1px 84px),
            radial-gradient(ellipse at 20% 0%, rgba(255,138,61,0.14), transparent 55%);
          display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid rgba(234,240,245,0.08); }
        .console-top{ display:flex; align-items:center; justify-content:space-between; }
        .brand-mark{ font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:24px; letter-spacing:0.01em; text-transform:uppercase; }
        .brand-mark span{ color:#FF8A3D; }
        .status-pill{ display:flex; align-items:center; gap:7px; font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:#4FD1C5; border:1px solid rgba(79,209,197,0.3); background:rgba(79,209,197,0.08); padding:6px 11px; border-radius:20px; }

function App() {
  const [usuarios, setUsuarios] = useState([]);
  const [carregandoUsuarios, setCarregandoUsuarios] = useState(true);
  const [erroUsuarios, setErroUsuarios] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [carregandoAuth, setCarregandoAuth] = useState(true);

  useEffect(() => {
    async function carregar() {
      const { data, error } = await supabaseClient.from("usuarios").select("*").order("created_at");
      if (error) {
        setErroUsuarios("Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.");
      } else {
        setUsuarios((data || []).map(rowToUsuario));
      }
      setCarregandoUsuarios(false);
    }
    carregar();
  }, []);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => {
      setAuthUser(data.session ? data.session.user : null);
      setCarregandoAuth(false);
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      setAuthUser(session ? session.user : null);
    });
    return () => { listener.subscription.unsubscribe(); };
  }, []);

  const usuarioLogado = authUser
    ? usuarios.find(u => u.email.toLowerCase() === (authUser.email || "").toLowerCase())
    : null;

  if (carregandoUsuarios || carregandoAuth) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0F141C", color: "#8893A6", fontFamily: "'Inter', sans-serif" }}>
        Carregando...
      </div>
    );
  }

  if (erroUsuarios) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0F141C", color: "#E07A7A", fontFamily: "'Inter', sans-serif", textAlign: "center", padding: 20 }}>
        {erroUsuarios}
      </div>
    );
  }

  if (!authUser) {
    return <TelaLogin />;
  }

  if (!usuarioLogado) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "#0F141C", color: "#E07A7A", fontFamily: "'Inter', sans-serif", textAlign: "center", padding: 20 }}>
        <div>Seu usuário está autenticado, mas não tem permissões cadastradas no sistema.<br />Fale com um administrador.</div>
        <button onClick={() => supabaseClient.auth.signOut()} style={{ marginTop: 16, background: "none", border: "1px solid #2A3445", color: "#AEB7C7", padding: "8px 14px", borderRadius: 8, cursor: "pointer" }}>Sair</button>
      </div>
    );
  }

  return (
    <SistemaEstoque
      usuarioLogado={usuarioLogado}
      usuarios={usuarios}
      setUsuarios={setUsuarios}
      onLogout={() => supabaseClient.auth.signOut()}
    />
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  componentDidCatch(erro, info) { console.error("Erro capturado pelo ErrorBoundary:", erro, info); }
  render() {
    if (this.state.erro) {
      return React.createElement("div", {
        style: { minHeight: "100vh", background: "#0F141C", color: "#F3EFE6", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "sans-serif", textAlign: "center" }
      },
        React.createElement("div", { style: { fontSize: 40, marginBottom: 12 } }, "⚠️"),
        React.createElement("h2", { style: { marginBottom: 10 } }, "Algo deu errado nessa tela"),
        React.createElement("div", {
          style: { background: "#161D29", border: "1px solid #3A1818", borderRadius: 8, padding: "12px 16px", maxWidth: 600, marginBottom: 20, color: "#E07A7A", fontFamily: "monospace", fontSize: 13, textAlign: "left", overflowWrap: "break-word" }
        }, String(this.state.erro && this.state.erro.message || this.state.erro)),
        React.createElement("div", { style: { fontSize: 13, color: "#8893A6", marginBottom: 20 } }, "Tire um print desta tela (com a mensagem em vermelho) e envie para o suporte — isso ajuda a corrigir rapidinho."),
        React.createElement("button", {
          onClick: () => window.location.reload(),
          style: { background: "#D2A256", color: "#1A1408", border: "none", borderRadius: 8, padding: "12px 24px", fontWeight: 700, cursor: "pointer" }
        }, "Recarregar o sistema")
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
</script>
